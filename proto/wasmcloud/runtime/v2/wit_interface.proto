syntax = "proto3";

package wasmcloud.runtime.v2;

message WitInterface {
  string namespace = 1;
  string package = 2;
  string version = 3;
  repeated string interfaces = 4;
  map<string, string> config = 5;
  // Optional instance name for multi-backend routing. When multiple entries
  // share the same namespace:package, each must have a unique name. Components
  // use this name as the identifier in resource-opening functions (e.g.,
  // store::open(name) for keyvalue, create-container(name) for blobstore).
  string name = 6;
  // Entries of the host's plugin-backed `secrets:` catalog whose values this
  // interface's config takes. The host resolves them when it binds the
  // workload; a request never carries the values.
  repeated PluginSecretRef plugin_secrets = 7;
}

// A workload's reference to an entry of the host's plugin-backed `secrets:`
// catalog.
message PluginSecretRef {
  // The catalog entry.
  string name = 1;
  // Config key -> the entry's key it takes. Empty takes every key of the
  // entry under its own name.
  map<string, string> keys = 2;
}
