# In-cluster OCI registry for the e2e suite.
#
# The `oci-registry` example component (a spec-compliant OCI v2 registry that
# stores through wasmcloud:blobstore) runs as a WorkloadDeployment on the
# `registry` hostgroup, which the e2e puts on an all-features host image for the
# async wasmcloud:blobstore plugin this component imports. Every other e2e
# fixture is then built locally, pushed into this registry, and pulled back by
# the `default` hostgroup. See runtime-operator/test/e2e/README or the
# `e2e-images` Make target for the surrounding flow.
#
# It serves HTTPS, from a certificate the chart mints off its own CA. Every host
# already mounts that CA for NATS, and the e2e points --oci-ca-path at it, so
# both sides trust the registry without distributing anything.
#
# Reachability: the host's HTTP server demuxes by Host header, so every
# authority a client uses must be registered as `host`/`host-aliases`, and the
# certificate has to carry each one as a SAN:
#   - pull (in-cluster host): oci-registry.wasmcloud-system.svc
#   - push (CI runner / dev):  127.0.0.1  (the Make target port-forwards here)
# The router matches the name without the port, so the push side is free to use
# an unprivileged one, which is what keeps `make e2e-images` from needing root.
# The operator only injects Service-DNS aliases for p2 `incoming-handler`, so a
# p3 `handler` interface keeps exactly the aliases set below.

# Two Secrets this file references are created by `cargo xtask e2e-images`
# rather than checked in here: `oci-registry-auth`, whose keys the operator
# materializes into the `wasmcloud:secrets` config below, and
# `oci-registry-pull`, which hostgroups present when pulling fixtures back out.
# They hold credentials that must match the push side exactly, and only the
# xtask can pick up E2E_REGISTRY_USER/E2E_REGISTRY_PASSWORD.

---
apiVersion: v1
kind: Service
metadata:
  name: oci-registry
  namespace: wasmcloud-system
spec:
  # No selector: the operator maintains the route EndpointSlice pointing at the
  # registry hostgroup pod (keyed on this Service name).
  #
  # 443 because an image reference carries no port and the hosts pull over
  # HTTPS, so they dial the scheme's default; the registry hostgroup serves on
  # 80, which the host container can bind unprivileged. The name has to stay
  # `http`, the port name the operator writes into the EndpointSlice, because
  # the mapping is by name. It describes the pod's port, not the scheme this
  # Service is reached over.
  type: ClusterIP
  ports:
    - name: http
      port: 443
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: oci-registry
  namespace: wasmcloud-system
spec:
  replicas: 1
  kubernetes:
    service:
      name: oci-registry
  template:
    spec:
      hostSelector:
        hostgroup: registry
      hostInterfaces:
        - namespace: wasi
          package: http
          version: "0.3.0"
          interfaces:
            - handler
          config:
            host: oci-registry
            host-aliases: oci-registry.wasmcloud-system,oci-registry.wasmcloud-system.svc,127.0.0.1
        - namespace: wasmcloud
          package: blobstore
          version: "0.1.0"
          interfaces:
            - blobstore
          config:
            backend: in-memory
        # The registry requires HTTP Basic auth on every request, `GET /v2/`
        # included, and reads the expected credentials through
        # `wasmcloud:secrets`, which the host's native secrets plugin serves
        # from this interface's config. The operator materializes that config
        # from the Secret below, so the values live in a Secret rather than in
        # this spec. Supplying neither credential is not an option: the
        # registry denies every request when the backend cannot produce both.
        - namespace: wasmcloud
          package: secrets
          version: "2.1.0"
          interfaces:
            - store
            - reveal
          secretFrom:
            - name: oci-registry-auth
      components:
        - name: oci-registry
          image: ghcr.io/wasmcloud/components/oci-registry:0.2.0
