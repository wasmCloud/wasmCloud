# In-cluster OCI registry for the e2e suite.
#
# The `oci-registry` example component (a spec-compliant OCI v2 registry that
# stores through wasmcloud:blobstore) runs as a WorkloadDeployment on the
# `registry` hostgroup — the one hostgroup left on HTTPS so it can pull this
# component from ghcr. Every other e2e fixture is then built locally and pushed
# into this registry, and the insecure `default` hostgroup pulls them back over
# plain HTTP. See runtime-operator/test/e2e/README or the `e2e-images` Make
# target for the surrounding flow.
#
# Reachability: the host's HTTP server demuxes by Host header, so every
# authority a client uses must be registered as `host`/`host-aliases`:
#   - pull (in-cluster host): oci-registry.wasmcloud-system.svc
#   - push (CI runner / dev):  127.0.0.1  (the Make target port-forwards here)
# The router matches the name without the port, so the push side is free to use
# an unprivileged one — which is what keeps `make e2e-images` from needing root.
# The operator only injects Service-DNS aliases for p2 `incoming-handler`, so a
# p3 `handler` interface keeps exactly the aliases set below.

---
# The credentials the registry checks incoming requests against. Delivered
# through `secretFrom` rather than literal interface config: the operator
# resolves the referenced Secret and merges its keys into the interface config
# the host's secrets plugin serves, which is how a real deployment supplies
# them — and it keeps the values out of the WorkloadDeployment spec. Key names
# are the config keys the registry asks for by name.
apiVersion: v1
kind: Secret
metadata:
  name: oci-registry-auth
  namespace: wasmcloud-system
type: Opaque
stringData:
  registry-username: e2e
  registry-password: e2e-registry-password
---
# Credentials the hostgroups present when pulling fixtures back out of the
# registry — the same pair as `oci-registry-auth` above, in the form an image
# pull takes. `MaterializeImagePullSecret` looks up the entry by the image
# reference's registry domain; `registryRef` builds refs on the `.svc` name, and
# the shorter Service-DNS forms are here so a ref written either way resolves.
#
# Spelled out under `stringData` rather than as base64 `data`, so the pair is
# reviewable and greppable next to the Secret it has to match — an encoded blob
# hides exactly the thing that has to stay in sync.
#
# Host component plugins do not use this: they are pulled at host startup,
# before any workload exists, so their credentials arrive as
# WASH_HOST_PLUGIN_REGISTRY_USER/PASSWORD on the host container instead.
apiVersion: v1
kind: Secret
metadata:
  name: oci-registry-pull
  namespace: wasmcloud-system
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "oci-registry.wasmcloud-system.svc": {"auth": "ZTJlOmUyZS1yZWdpc3RyeS1wYXNzd29yZA=="},
        "oci-registry.wasmcloud-system": {"auth": "ZTJlOmUyZS1yZWdpc3RyeS1wYXNzd29yZA=="},
        "oci-registry": {"auth": "ZTJlOmUyZS1yZWdpc3RyeS1wYXNzd29yZA=="}
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: oci-registry
  namespace: wasmcloud-system
spec:
  # No selector: the operator maintains the route EndpointSlice pointing at the
  # registry hostgroup pod (keyed on this Service name). port 80 -> the host's
  # HTTP port (the registry hostgroup runs http.port=80).
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: oci-registry
  namespace: wasmcloud-system
spec:
  replicas: 1
  kubernetes:
    service:
      name: oci-registry
  template:
    spec:
      hostSelector:
        hostgroup: registry
      hostInterfaces:
        - namespace: wasi
          package: http
          version: "0.3.0"
          interfaces:
            - handler
          config:
            host: oci-registry
            host-aliases: oci-registry.wasmcloud-system,oci-registry.wasmcloud-system.svc,127.0.0.1
        - namespace: wasmcloud
          package: blobstore
          version: "0.1.0"
          interfaces:
            - blobstore
          config:
            backend: in-memory
        # The registry requires HTTP Basic auth on every request, `GET /v2/`
        # included, and reads the expected credentials through
        # `wasmcloud:secrets`, which the host's native secrets plugin serves
        # from this interface's config. The operator materializes that config
        # from the Secret below, so the values live in a Secret rather than in
        # this spec. Supplying neither credential is not an option: the
        # registry denies every request when the backend cannot produce both.
        - namespace: wasmcloud
          package: secrets
          version: "2.1.0"
          interfaces:
            - store
            - reveal
          secretFrom:
            - name: oci-registry-auth
      components:
        - name: oci-registry
          image: ghcr.io/wasmcloud/components/oci-registry:0.2.0
