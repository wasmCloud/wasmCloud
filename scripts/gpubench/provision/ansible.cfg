[defaults]
# Run from this directory:
#   cd scripts/gpubench/provision && ansible-playbook provision-cuda.yml
inventory = ./inventory.yml
host_key_checking = True
stdout_callback = ansible.builtin.default
result_format = yaml
retry_files_enabled = False
# Ubuntu's python3, and on macOS the Command Line Tools' (provision-metal.yml
# checks they're installed before it gathers facts).
interpreter_python = /usr/bin/python3

[ssh_connection]
ssh_args = -o BatchMode=yes -o ConnectTimeout=15 -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
