# kind cluster for scripts/k6bench — the same file on a laptop, in the smoke
# workflow and on the Hetzner bench host.
#
# Based on deploy/kind/kind-config.yaml, but kept as its own copy: the node
# image is pinned by digest so a Kubernetes bump only moves the published
# numbers when someone changes this line on purpose.
#
# Two nodes. kind taints the control-plane in a multi-node cluster, so every
# chart pod (hosts, NATS, operator) lands on the worker and the control-plane
# node only runs Kubernetes itself. On the bench host `run.sh --pin` gives each
# node container its own CPUs (see README.md).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        enable-admission-plugins: NodeRestriction,OwnerReferencesPermissionEnforcement
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f
    # Convenience only: the ingress NodePort on the laptop's loopback, for curl
    # and a native k6 on macOS. run.sh prefers the worker's IP, which skips
    # Docker's port-forwarding proxy entirely.
    extraPortMappings:
      - containerPort: 30950
        hostPort: 30950
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    image: kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f
    labels:
      k6bench/role: hosts
