# Rendered once per leaf by run.sh, __I__ = 0 … 9.
apiVersion: v1
kind: Service
metadata:
  name: fanout-leaf-__I__
spec:
  # No selector: the operator writes this Service's EndpointSlice, pointing at
  # the host pods running the workload below, and registers fanout-leaf-__I__.<namespace>
  # as a Host alias for it.
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: fanout-leaf-__I__
spec:
  replicas: 1
  kubernetes:
    service:
      name: fanout-leaf-__I__
  template:
    spec:
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: fanout-leaf-__I__.k6bench
            localRoute: fanout-leaf-__I__.internal
      components:
        - name: hello
          image: __HELLO_IMAGE__
