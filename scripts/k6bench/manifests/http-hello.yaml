# Entry point: k6 reaches it on every node at :30950.
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  # No selector: the operator writes this Service's EndpointSlice, pointing at
  # the host pods running the workload below, and registers hello.<namespace>
  # as a Host alias for it.
  type: NodePort
  ports:
    - name: http
      port: 80
      protocol: TCP
      nodePort: 30950
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: hello
spec:
  replicas: 1
  kubernetes:
    service:
      name: hello
  template:
    spec:
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: hello.k6bench
      components:
        - name: hello
          image: __HELLO_IMAGE__
