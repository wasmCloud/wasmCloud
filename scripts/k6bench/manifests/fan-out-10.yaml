# Entry point: calls all ten leaves (fan-out-10.each.yaml) concurrently over
# same-host local routing (their localRoute names).
# Entry point: k6 reaches it on every node at :30950.
apiVersion: v1
kind: Service
metadata:
  name: fanout
spec:
  # No selector: the operator writes this Service's EndpointSlice, pointing at
  # the host pods running the workload below, and registers fanout.<namespace>
  # as a Host alias for it.
  type: NodePort
  ports:
    - name: http
      port: 80
      protocol: TCP
      nodePort: 30950
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: fanout
spec:
  replicas: 1
  kubernetes:
    service:
      name: fanout
  template:
    spec:
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: fanout.k6bench
      components:
        - name: relay
          image: __RELAY_IMAGE__
          localResources:
            allowedHosts:
              - fanout-leaf-0.internal
              - fanout-leaf-1.internal
              - fanout-leaf-2.internal
              - fanout-leaf-3.internal
              - fanout-leaf-4.internal
              - fanout-leaf-5.internal
              - fanout-leaf-6.internal
              - fanout-leaf-7.internal
              - fanout-leaf-8.internal
              - fanout-leaf-9.internal
            environment:
              config:
                TARGETS: "http://fanout-leaf-0.internal/,http://fanout-leaf-1.internal/,http://fanout-leaf-2.internal/,http://fanout-leaf-3.internal/,http://fanout-leaf-4.internal/,http://fanout-leaf-5.internal/,http://fanout-leaf-6.internal/,http://fanout-leaf-7.internal/,http://fanout-leaf-8.internal/,http://fanout-leaf-9.internal/"
