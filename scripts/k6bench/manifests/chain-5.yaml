# link-0 (entry, chain.k6bench) → link-1 → … → link-4, one hop each, by localRoute name
# (`--routing local`) or Service DNS (`--routing network`).
# Entry point: k6 reaches it on every node at :30950.
apiVersion: v1
kind: Service
metadata:
  name: chain-link-0
spec:
  # No selector: the operator writes this Service's EndpointSlice, pointing at
  # the host pods running the workload below, and registers chain-link-0.<namespace>
  # as a Host alias for it.
  type: NodePort
  ports:
    - name: http
      port: 80
      protocol: TCP
      nodePort: 30950
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: chain-link-0
spec:
  replicas: 1
  kubernetes:
    service:
      name: chain-link-0
  template:
    spec:
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: chain.k6bench
            localRoute: chain-link-0.internal
      components:
        - name: relay
          image: __RELAY_IMAGE__
          localResources:
            allowedHosts:
              - chain-link-1.__CALL_DOMAIN__
            environment:
              config:
                TARGETS: "http://chain-link-1.__CALL_DOMAIN__/"
---
