version: 2.0.0

build:
  # `wasmcloud:nats` is async throughout, so this is a WASI P3 component:
  # built as a wasm32-wasip1 core module and wrapped into a component by
  # `wash build` afterward.
  command: cargo build --target wasm32-wasip1 --release --locked
  component_path: target/wasm32-wasip1/release/nats_jetstream_replay.wasm
