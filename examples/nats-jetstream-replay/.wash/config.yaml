version: 2.0.0

build:
  # `wasmcloud:nats` is async throughout, so this is a WASI P3 component. The
  # target is `wasip2`: it emits a component directly, and the P2 platform
  # imports it carries are orthogonal to the async lifting of the NATS calls.
  command: cargo build --target wasm32-wasip2 --release --locked
  component_path: target/wasm32-wasip2/release/nats_jetstream_replay.wasm
