[overrides]
"wasi:cli" = { path = "../p3-wit-deps/wasi-cli-0.3.0" }
"wasi:clocks" = { path = "../p3-wit-deps/wasi-clocks-0.3.0" }
"wasi:filesystem" = { path = "../p3-wit-deps/wasi-filesystem-0.3.0" }
"wasi:random" = { path = "../p3-wit-deps/wasi-random-0.3.0" }
"wasi:sockets" = { path = "../p3-wit-deps/wasi-sockets-0.3.0" }
"wasi:tls" = { path = "../p3-wit-deps/wasi-tls-0.3.0-draft" }
# The host defines `wasmcloud:tls` itself, so reference its canonical WIT and
# the fixture cannot drift from what the host serves.
"wasmcloud:tls" = { path = "../../../../../wit/tls/wit" }
"acme:tlsprobe" = { path = "../acme-tlsprobe" }
