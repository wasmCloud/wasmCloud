[overrides]
"wasi:cli" = { path = "../p3-wit-deps/wasi-cli-0.3.0" }
"wasi:clocks" = { path = "../p3-wit-deps/wasi-clocks-0.3.0" }
"wasi:filesystem" = { path = "../p3-wit-deps/wasi-filesystem-0.3.0" }
"wasi:http" = { path = "../p3-wit-deps/wasi-http-0.3.0" }
"wasi:random" = { path = "../p3-wit-deps/wasi-random-0.3.0" }
"wasi:sockets" = { path = "../p3-wit-deps/wasi-sockets-0.3.0" }
"acme:secretsproxy" = { path = "../secrets-consumer-plugin/wit" }
# acme:secretsproxy's own world imports wasmcloud:secrets (including the
# labeled `secret` interface); without this override too, resolving that
# transitive dependency falls through to the published registry, which
# lags the in-repo source — see wasmcloud:secrets' own `wkg.toml` override
# in secrets-consumer-plugin for why.
"wasmcloud:secrets" = { path = "../../../../../wit/secrets/wit" }
