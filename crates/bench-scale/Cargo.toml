[package]
name = "bench-scale"
description = "Host density benchmark: how many HTTP workloads one wasmCloud host holds, over its NATS API."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bench-scale"
path = "src/main.rs"

[lints]
workspace = true

# Deliberately no wash-runtime: the bench talks to whatever host it is given
# over NATS and HTTP only, so it can compare host binaries.
[dependencies]
bench-tools = { path = "../bench-tools" }
anyhow = { workspace = true, features = ["std"] }
async-nats = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["std"] }
flate2 = { workspace = true, features = ["rust_backend"] }
futures = { workspace = true, features = ["std"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
sysinfo = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
wit-component = { workspace = true }
wasi-preview1-component-adapter-provider = "46"
