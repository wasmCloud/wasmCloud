# Single source of truth for this repo's labels: color, description, aliases,
# and the path rules that apply them. labels-sync.yml reconciles the label set,
# labeler.yml renders `rules` for actions/labeler, and labels.mjs validates
# this file. A label with no `rules` is applied by hand; `aliases` renames an
# existing label in place, keeping the issues and PRs already tagged with it.

'upgrade-impact':
  color: 'd8709f'
  description: 'This PR has potential upgrade or downgrade impact for operators'
  rules:
    - changed-files:
        - any-glob-to-any-file:
            - 'runtime-operator/api/**/*_types.go'
            - 'runtime-operator/api/**/groupversion_info.go'
            - 'runtime-operator/api/**/zz_generated.deepcopy.go'
            - 'runtime-operator/config/**'
            - 'charts/**'
            - '.github/scripts/runtime-operator-rbac-parity.mjs'
            - 'deploy/**'
            - 'runtime-operator/cmd/main.go'
            - 'runtime-gateway/main.go'
            # Host policy, quota, and observability knobs an operator tunes.
            - 'crates/wash-runtime/src/observability.rs'
            - 'crates/wash-runtime/src/timeouts.rs'
            - 'crates/wash-runtime/src/config_source.rs'
            - 'crates/wash-runtime/src/host/allowed_*.rs'
            - 'crates/wash-runtime/src/host/egress_policy.rs'
            - 'crates/wash-runtime/src/host/quota.rs'
            - 'crates/wash-runtime/src/host/ports.rs'
            - 'crates/wash-runtime/src/host/declared_port.rs'

# Escape hatch for the crd-diff job in runtime-operator.yml.
'crd-diff-override':
  color: 'ff8c00'
  description: 'Bypass the crd-diff CRD compatibility check on this PR'

# Whether the schema change is COMPATIBLE is enforced separately, by
# the crd-diff job in runtime-operator.yml.
'area/crd':
  color: '0b7285'
  description: 'CRD schema; may require re-applying CRDs on upgrade'
  rules:
    - changed-files:
        - any-glob-to-any-file:
            - 'runtime-operator/api/**/*_types.go'
            - 'runtime-operator/api/**/groupversion_info.go'
            - 'runtime-operator/api/**/zz_generated.deepcopy.go'
            - 'runtime-operator/config/crd/**'
            - 'charts/runtime-operator/crds/**'

# Overlaps area/crd on charts/runtime-operator/crds/ on purpose:
# `helm upgrade` does not update CRDs under a chart's crds/ dir, so a
# CRD bump is a chart concern too -- someone must apply it by hand.
'area/helm':
  color: '4b55df'
  description: 'Impacts the Helm chart and user deployment experience'
  aliases: ['helm']
  rules:
    - changed-files:
        - any-glob-to-any-file:
            - 'charts/**'

# config/rbac is controller-gen output; the chart hand-maps it.
'area/rbac':
  color: 'a10d5c'
  description: 'RBAC roles and bindings; may require re-applying on upgrade'
  rules:
    - changed-files:
        - any-glob-to-any-file:
            - 'runtime-operator/config/rbac/**'
            - 'charts/runtime-operator/templates/**/*role*.yaml'
            - 'charts/runtime-operator/templates/**/serviceaccount.yaml'
            - '.github/scripts/runtime-operator-rbac-parity.mjs'

