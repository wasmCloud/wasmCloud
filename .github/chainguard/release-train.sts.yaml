# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

issuer: https://token.actions.githubusercontent.com
subject: repo:wasmCloud/wasmCloud:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: wasmCloud/wasmCloud/.github/workflows/release-train.yml@refs/heads/main

# Push the release/vX.Y.Z branch, open its PR and enable auto-merge. An
# app token, unlike GITHUB_TOKEN, lets that push and PR trigger CI.
permissions:
  contents: write
  pull_requests: write
