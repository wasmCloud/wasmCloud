# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

issuer: https://token.actions.githubusercontent.com
subject: repo:wasmCloud/wasmCloud:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: wasmCloud/wasmCloud/.github/workflows/osps-baseline.yml@refs/heads/main

# Read-only: the scanner only inspects repository settings and files.
permissions:
  actions: read
  administration: read
  contents: read
  security_events: read
