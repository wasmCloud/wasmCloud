name: "OCI push with digest"
description: >
  Pushes a wasm artifact to an OCI ref via `wash oci push`, skipping the
  push (and reporting `published: false`) if that ref already exists.
  When pushing, it reports the manifest digest so the caller can attest it.
  Requires `wash`, `jq`, and `docker` on PATH, and (if the destination
  needs auth) a prior `docker login`. This action does not set either up
  itself, since callers already need `wash` for their own build and may
  already be logged in for other reasons.

inputs:
  ref:
    description: "Full OCI reference to push to, e.g. ghcr.io/wasmcloud/examples/http-hello-world:0.1.0."
    required: true
  artifact:
    description: "Path to the wasm artifact to push."
    required: true
  mutable-prerelease:
    description: >
      When "true", a `ref` whose tag has a SemVer pre-release suffix (a `-`,
      e.g. `1.0.0-rc.1`) skips the already-exists check and always pushes —
      useful for workflows that iterate on pre-release tags. Stable tags
      (no `-`) are still treated as immutable either way. Default "false":
      every tag, stable or not, is immutable once published.
    required: false
    default: "false"

outputs:
  published:
    description: "'true' if this run pushed a new tag; 'false' if the ref already existed."
    value: ${{ steps.push.outputs.published }}
  digest:
    description: "Manifest digest of the pushed image. Only set when `published` is 'true'."
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Push or skip
      id: push
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        ARTIFACT: ${{ inputs.artifact }}
        MUTABLE_PRERELEASE: ${{ inputs.mutable-prerelease }}
      run: |
        set -euo pipefail
        TAG="${REF##*:}"
        # Skip the immutability check only when the caller opted into
        # mutable pre-releases AND this tag actually is one; every other
        # case (default, or a stable tag even with mutable-prerelease=true)
        # still enforces immutability.
        if [[ "${MUTABLE_PRERELEASE}" != "true" || ! "${TAG}" =~ - ]]; then
          # Distinguish three outcomes: tag exists (skip), manifest unknown
          # (proceed), any other error from the inspect (abort) — an
          # ambiguous inspect failure (network blip, auth issue) is not
          # license to attempt a push that might also just fail.
          if INSPECT_ERR=$(docker manifest inspect "${REF}" 2>&1 >/dev/null); then
            echo "${REF} already exists at the destination — skipping (immutable)"
            echo "published=false" >> "${GITHUB_OUTPUT}"
            exit 0
          elif echo "${INSPECT_ERR}" | grep -qiE 'manifest unknown|no such manifest|not found'; then
            echo "${REF} not yet published — proceeding with push"
          else
            echo "destination check for ${REF} failed — refusing to push" >&2
            echo "${INSPECT_ERR}" >&2
            exit 1
          fi
        fi
        echo "Publishing ${REF}"
        # `wash -o json oci push` wraps the response as
        # `{ "success": true, "data": { "digest": "sha256:…" } }`. `.digest`
        # fallback is for older wash builds that emitted the unwrapped form.
        PUSH_OUT=$(wash -o json oci push "${REF}" "${ARTIFACT}")
        echo "${PUSH_OUT}"
        DIGEST=$(echo "${PUSH_OUT}" | jq -r '.data.digest // .digest // empty')
        if [[ -z "${DIGEST}" ]]; then
          echo "wash oci push did not report a manifest digest for ${REF}" >&2
          exit 1
        fi
        echo "published=true" >> "${GITHUB_OUTPUT}"
        echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
