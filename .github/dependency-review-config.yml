# dependency-review-action policy for audit.yml. allow-licenses mirrors
# deny.toml's [licenses] allow; allow-dependencies-licenses names each crate in
# its exceptions, whose approved license cargo-deny enforces. Keep them in step.
# A non-Cargo exception needs a CNCF exception and skips license checks entirely.
fail-on-severity: low
fail-on-scopes: [runtime, development, unknown]
allow-licenses:
  - Apache-2.0
  - Apache-2.0 WITH LLVM-exception
  - 0BSD
  - BSD-2-Clause
  - BSD-2-Clause-FreeBSD
  - BSD-3-Clause
  - ISC
  - MIT
  - MIT-0
  - OpenSSL
  - PostgreSQL
  - PSF-2.0
  - Python-2.0
  - Python-2.0.1
  - UPL-1.0
  - X11
  - Zlib
allow-dependencies-licenses:
  - pkg:cargo/imbl
  - pkg:cargo/imbl-sized-chunks
  - pkg:cargo/icu_collections
  - pkg:cargo/icu_locale_core
  - pkg:cargo/icu_normalizer
  - pkg:cargo/icu_normalizer_data
  - pkg:cargo/icu_properties
  - pkg:cargo/icu_properties_data
  - pkg:cargo/icu_provider
  - pkg:cargo/litemap
  - pkg:cargo/potential_utf
  - pkg:cargo/tinystr
  - pkg:cargo/unicode-ident
  - pkg:cargo/writeable
  - pkg:cargo/yoke
  - pkg:cargo/yoke-derive
  - pkg:cargo/zerofrom
  - pkg:cargo/zerofrom-derive
  - pkg:cargo/zerotrie
  - pkg:cargo/zerovec
  - pkg:cargo/zerovec-derive
  - pkg:cargo/webpki-roots
  - pkg:cargo/hexf-parse
# GHSA IDs of advisories ignored in .cargo/audit.toml.
allow-ghsas: []
