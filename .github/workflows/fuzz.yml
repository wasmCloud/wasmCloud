name: fuzz

on:
  workflow_call:
    inputs:
      sha:
        description: Exact release commit to fuzz privately
        required: true
        type: string

permissions: {}

jobs:
  gate:
    if: github.repository == 'wasmCloud/wasmCloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require private fuzzing on the release commit
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: node .github/scripts/release-fuzz.mjs
