name: examples

# Validates and (on push to main) publishes the Rust components under
# examples/. Pipeline:
#   matrix    calls the shared component-matrix.yml reusable workflow:
#             dorny/paths-filter → plan-matrix.mjs picks the build matrix
#             for this event (PR = intersection with changed paths, push
#             or examples-canary label = everything), and
#             coverage-matrix.mjs asserts ITEMS matches examples/ on disk
#             (every dir with .wash/config.yaml + Cargo.toml is enrolled;
#             every top-level example has a README.md).
#   build     matrix-fans over matrix.outputs.matrix; each cell runs
#             build-rust-component (fmt + clippy + wash build, plus
#             OCI publish on pushes to main when `image` is set).
#
# Multi-component example (grpc-hello-world): one ITEMS entry per
# component, both sharing `filter: grpc-hello-world` so a change anywhere
# under examples/grpc-hello-world/** rebuilds both client and server.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  matrix:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/component-matrix.yml
    with:
      # `env` isn't an available context for a reusable-workflow call's
      # `with:`, so these live here directly rather than in a top-level
      # `env:` block. omit `image` to skip publish; `filter`, when present,
      # points at the paths-filter group that gates this item so that
      # multiple items can share a `filter`, e.g. examples/grpc-hello-world/**.
      items: |
        [
          {"key": "blobby",                   "workdir": "examples/blobby",                              "image": "ghcr.io/wasmcloud/components/blobby"},
          {"key": "grpc-hello-world-client",  "filter": "grpc-hello-world",   "workdir": "examples/grpc-hello-world/component-client", "image": "ghcr.io/wasmcloud/components/grpc-hello-world-client", "needs_protoc": true},
          {"key": "grpc-hello-world-server",  "filter": "grpc-hello-world",   "workdir": "examples/grpc-hello-world/component-server", "image": "ghcr.io/wasmcloud/components/grpc-hello-world-server", "needs_protoc": true},
          {"key": "http-hello-world-persistent-storage", "workdir": "examples/http-hello-world-persistent-storage", "image": "ghcr.io/wasmcloud/components/http-hello-world-persistent-storage"},
          {"key": "nats-jetstream-replay",    "workdir": "examples/nats-jetstream-replay",               "image": "ghcr.io/wasmcloud/components/nats-jetstream-replay"},
          {"key": "oci-registry",            "workdir": "examples/oci-registry",                       "image": "ghcr.io/wasmcloud/components/oci-registry"},
          {"key": "otel-config",              "workdir": "examples/otel-config",                         "image": "ghcr.io/wasmcloud/components/otel-config"},
          {"key": "qrcode",                   "workdir": "examples/qrcode",                              "image": "ghcr.io/wasmcloud/components/qrcode"}
        ]
      # When these change, every example rebuilds. The last entry is a TODO:
      # drop it once wasmcloud:nats is published to crates.io.
      shared-paths: |
        [
          ".github/actions/build-rust-component/**",
          ".github/actions/oci-push-with-digest/**",
          ".github/actions/setup-rust/**",
          ".github/scripts/plan-matrix.mjs",
          ".github/scripts/coverage-matrix.mjs",
          ".github/scripts/gen-filters.mjs",
          ".github/workflows/examples.yml",
          "crates/wash-runtime/wit/deps/wasmcloud-nats-0.1.0/**"
        ]
      discovery-root: examples
      # Scoped to Rust because this workflow is Rust-only — a non-Rust
      # subdirectory under examples/ wouldn't have a Cargo.toml and is
      # silently ignored by the disk scan.
      require-files: '["Cargo.toml"]'
      require-readme: true
      canary-label: examples-canary

  build:
    needs:
      - matrix
    if: needs.matrix.outputs.has_items == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required so build-rust-component's OCI publish step can push to ghcr
      # on push events. PRs (including forks) get the token in read-only
      # mode, so the publish step is a no-op there even with this set.
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          install-nightly: "true"
          install-wash: "true"

      - if: matrix.needs_protoc
        uses: ./.github/actions/setup-protoc

      - uses: ./.github/actions/build-rust-component
        with:
          working-directory: ${{ matrix.workdir }}
          image: ${{ matrix.image }}

  gate:
    needs:
      - matrix
      - build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
