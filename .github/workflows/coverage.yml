name: coverage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/coverage.yml'
      - '.github/scripts/coverage-summary.mjs'
      - '.github/actions/setup-rust/**'
      - '.github/tool-versions.env'
      - '.cargo/**'
      - 'crates/**'
      - 'xtask/**'
      - 'wit/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust coverage (80% lines and regions)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/free-disk-space
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime-operator/go.mod
          cache: false
      - name: Load pinned tool versions
        run: grep -vE '^[[:space:]]*(#|$)' .github/tool-versions.env >> "$GITHUB_ENV"
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}
      - uses: $/.github/actions/setup-rust
      - name: Install matching LLVM tools
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_WASMCLOUD_CI_PULL_USER }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_WASMCLOUD_CI_PULL }}
        run: |
          if [[ -n "$DOCKERHUB_PASSWORD" ]]; then
            echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USER" --password-stdin
          fi
      - name: Validate coverage runner
        run: cargo test --locked -p xtask coverage::tests
      - name: Collect coverage, including Docker and registry tests
        id: tests
        run: cargo xtask coverage test
      - name: Generate coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        id: report
        run: cargo xtask coverage report
      - name: Require 80% line and region coverage
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        id: threshold
        run: cargo xtask coverage check
      - name: Write coverage evidence summary
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          THRESHOLD_RESULT: ${{ steps.threshold.outcome }}
        run: node .github/scripts/coverage-summary.mjs
      - name: Preserve coverage evidence
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 90
