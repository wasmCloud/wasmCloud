name: coverage

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Merge groups and main measure Rust and Go; pull requests use input filters.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/coverage.yml'
              - '.github/scripts/coverage-summary.mjs'
              - '.github/actions/setup-rust/**'
              - '.github/tool-versions.env'
              - '.cargo/**'
              - 'crates/**'
              - 'xtask/**'
              - 'wit/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            go:
              - '.github/workflows/coverage.yml'
              - '.github/scripts/go-coverage*'
              - '.github/actions/setup-go/**'
              - '.github/tool-versions.env'
              - 'runtime-operator/**'
              - 'runtime-gateway/**'
              - 'proto/**'

  go:
    name: Go coverage (${{ matrix.module }})
    needs:
      - changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [runtime-operator, runtime-gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - name: Validate Go coverage accounting
        run: node --test .github/scripts/go-coverage.test.mjs
      - name: Install pinned branch coverage tool
        run: |
          source .github/tool-versions.env
          go install "github.com/rillig/gobco@v${GOBCO_VERSION}"
      - name: Prepare operator integration tests
        if: matrix.module == 'runtime-operator'
        working-directory: runtime-operator
        env:
          GOWORK: "off"
        run: |
          make manifests generate envtest LOCALBIN="$RUNNER_TEMP/operator-tools"
          assets=$("$RUNNER_TEMP/operator-tools/setup-envtest" use 1.31.0 --bin-dir "$RUNNER_TEMP/operator-tools" -p path)
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - name: Collect statement and branch coverage
        id: collect
        env:
          MODULE: ${{ matrix.module }}
        run: node .github/scripts/go-coverage.mjs "$MODULE"
      - name: Preserve Go coverage evidence
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.module }}-coverage
          path: target/go-coverage/${{ matrix.module }}/
          if-no-files-found: error
          retention-days: 90

  rust:
    name: Rust coverage
    needs:
      - changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/free-disk-space
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime-operator/go.mod
          cache: false
      - name: Load pinned tool versions
        run: grep -vE '^[[:space:]]*(#|$)' .github/tool-versions.env >> "$GITHUB_ENV"
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}
      - uses: $/.github/actions/setup-rust
      - name: Install pinned coverage nightly and matching LLVM tools
        run: cargo xtask coverage setup
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_WASMCLOUD_CI_PULL_USER }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_WASMCLOUD_CI_PULL }}
        run: |
          if [[ -n "$DOCKERHUB_PASSWORD" ]]; then
            echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USER" --password-stdin
          fi
      - name: Validate coverage runner
        run: cargo test --locked -p xtask coverage::tests
      - name: Collect coverage, including Docker and registry tests
        id: tests
        run: cargo xtask coverage test
      - name: Generate coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        id: report
        run: cargo xtask coverage report
      - name: Require line and region coverage thresholds
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        id: threshold
        run: cargo xtask coverage check
      - name: Write coverage evidence summary
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          THRESHOLD_RESULT: ${{ steps.threshold.outcome }}
        run: node .github/scripts/coverage-summary.mjs
      - name: Preserve coverage evidence
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 90
