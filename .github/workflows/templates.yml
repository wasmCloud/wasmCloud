name: templates

# Validates the templates under templates/ by scaffolding each one via
# `wash new` against the local checkout and running it through the
# same fmt + clippy + build pipeline as examples.
#
# Pipeline:
#   matrix    calls the shared component-matrix.yml reusable workflow:
#             dorny/paths-filter → plan-matrix.mjs picks the build matrix
#             for this event (PR = intersection with changed paths, push
#             or canary label = everything), and coverage-matrix.mjs
#             asserts ITEMS matches templates/ on disk, so a new/removed
#             template can't silently bypass CI.
#   build     matrix-fans over matrix.outputs.matrix; each cell scaffolds
#             with `wash new file://$GITHUB_WORKSPACE` and reuses
#             build-rust-component without an `image:` so the action's
#             publish steps no-op.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  matrix:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/component-matrix.yml
    with:
      # `env` isn't an available context for a reusable-workflow call's
      # `with:`, so these live here directly rather than in a top-level
      # `env:` block. To add a template: drop the directory under
      # templates/, then append to this list.
      items: |
        [
          {"key": "http-api-with-distributed-workloads", "workdir": "templates/http-api-with-distributed-workloads"},
          {"key": "http-client",                          "workdir": "templates/http-client"},
          {"key": "http-handler",                         "workdir": "templates/http-handler"},
          {"key": "http-hello-world",                     "workdir": "templates/http-hello-world"},
          {"key": "http-kv-handler",                      "workdir": "templates/http-kv-handler"},
          {"key": "service-tcp",                          "workdir": "templates/service-tcp"}
        ]
      # When these change, every template rebuilds.
      shared-paths: |
        [
          ".github/actions/build-rust-component/**",
          ".github/actions/oci-push-with-digest/**",
          ".github/actions/setup-rust/**",
          ".github/scripts/plan-matrix.mjs",
          ".github/scripts/coverage-matrix.mjs",
          ".github/scripts/gen-filters.mjs",
          ".github/workflows/templates.yml"
        ]
      discovery-root: templates
      require-files: '["Cargo.toml"]'
      require-readme: true
      canary-label: templates-canary

  build:
    needs:
      - matrix
    if: needs.matrix.outputs.has_items == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On PRs, actions/checkout defaults to refs/pull/N/merge (a
          # detached HEAD). `wash new file://$GITHUB_WORKSPACE` performs
          # a `git clone` from the workspace; pinning the SHA makes the
          # clone source a regular commit instead of detached HEAD.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-rust
        with:
          install-nightly: "true"

      - uses: wasmcloud/setup-wash-action@47756fa211cc82f392c57e39504f43ef46fc0b3e # v2.1.0

      - name: Scaffold via `wash new` from local checkout
        working-directory: ${{ runner.temp }}
        env:
          WORKSPACE: ${{ github.workspace }}
          TEMPLATE: ${{ matrix.key }}
          SUBFOLDER: ${{ matrix.workdir }}
        run: |
          # file:// → wash new does a local git clone of the workspace at
          # HEAD (the SHA pinned by checkout above). No remote round-trip
          # for the template content.
          #
          # Workaround for #5152: `--non-interactive` doesn't suppress
          # the `new.command` confirmation, and wash dies with "not a
          # terminal" off-TTY. script(1) supplies a PTY; the bounded
          # printf auto-accepts. (Unbounded `yes |` deadlocks at job
          # timeout because yes never closes the pipe.)
          # TODO: drop once a wash release with the #5152 fix is out.
          printf 'y\ny\ny\n' | script -qec "wash new 'file://${WORKSPACE}' --subfolder '${SUBFOLDER}' --name '${TEMPLATE}' --non-interactive" /dev/null

      - uses: ./.github/actions/build-rust-component
        with:
          working-directory: ${{ runner.temp }}/${{ matrix.key }}

  gate:
    needs:
      - matrix
      - build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
