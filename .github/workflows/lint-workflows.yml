name: lint-workflows
on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/release-*'
      - '.github/scripts/lib/release-fakes.mjs'
      - 'xtask/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions: {}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/release-*'
              - '.github/scripts/lib/release-fakes.mjs'
              - 'xtask/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  zizmor:
    needs:
      - changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required: the action uploads its findings as SARIF to the GitHub
      # Code Scanning API. Without this, the upload step errors with
      # "Resource not accessible by integration" and fails the job.
      # Fork PRs auto-restrict the token to read-only; the action handles
      # that internally and skips the upload rather than failing.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # The private fuzz workflow is deployed from here but lives outside
          # .github/workflows, so name it explicitly.
          inputs: . fuzz/private/fuzz.yml
        env:
          # Used by zizmor for online audits (e.g. checking whether a
          # referenced action's tag still resolves to its pinned SHA).
          GH_TOKEN: ${{ github.token }}

  release-scripts:
    needs:
      - changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release promotion and SBOM checks
        run: |
          node --test .github/scripts/release-*.test.mjs
          cargo test --locked -p xtask fuzz
      - name: Lint private fuzz workflow
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes= fuzz/private/fuzz.yml

  gate:
    name: gate-lint-workflows
    needs:
      - zizmor
      - release-scripts
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
