name: bench run

on:
  workflow_call:
    inputs:
      bench:
        required: true
        type: string
      ref:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      # What the run is called, when it is a named variant of `bench`.
      name:
        required: false
        type: string
        default: ""
      # Environment variables preset for the bench, as a JSON object of
      # strings. Comes from the calling workflow's own file, not from input.
      env:
        required: false
        type: string
        default: "{}"
      # Whether results may enter the public history (pull-request refs
      # never do).
      publish:
        required: false
        type: boolean
        default: true
    secrets:
      aws_role_arn:
        required: true
      aws_region:
        required: true
      s3_bucket:
        required: true
      cf_distribution_id:
        required: true

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  bench:
    name: ${{ inputs.name || inputs.bench }}
    runs-on: [self-hosted, bench, hetzner]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      WASMCLOUD_BENCH_NAME: ${{ inputs.bench }}
      # Persist the cargo build cache outside $GITHUB_WORKSPACE so
      # actions/checkout's clean step doesn't blow it away every run.
      CARGO_TARGET_DIR: /var/lib/bench/target
      CARGO_INCREMENTAL: "0"
      # The ref recorded on each data row — bench-tools/meta.rs reads this as
      # the single source of truth for what was benched. It's the resolved,
      # normalized matrix ref (the tag for `release`, the checked-out ref for a
      # dispatch). meta.rs deliberately ignores GITHUB_REF_NAME, which is the
      # *dispatch* ref (e.g. `main` even when the `ref` input is v2.5.2) and
      # would hide tag runs from the semver-filtered releases view.
      WASMCLOUD_BENCH_REF: ${{ inputs.ref }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Queued jobs measure the commit resolved by the matrix job.
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          # Don't leave the GITHUB_TOKEN in .git/config; the bench host
          # then runs untrusted user code (the bench under test) and we
          # don't want it to be able to read or use the token.
          persist-credentials: false

      - name: verify commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: pre-flight host checks
        env:
          # Expected hostname of the dedicated bench host. Set as a repo
          # variable (Settings → Secrets and variables → Actions → Variables).
          # Kept out of the repo so the box's identity isn't broadcast.
          WASMCLOUD_BENCH_HOSTNAME: ${{ vars.WASMCLOUD_BENCH_HOSTNAME }}
        run: node .github/scripts/bench-preflight.mjs

      - name: preset environment
        if: ${{ inputs.env != '{}' }}
        env:
          PRESET: ${{ inputs.env }}
        # Names are environment-variable names and values single lines, so
        # nothing can end the GITHUB_ENV entry early or set another.
        run: |
          node -e '
            const fs = require("fs");
            for (const [name, value] of Object.entries(JSON.parse(process.env.PRESET))) {
              if (!/^[A-Z][A-Z0-9_]*$/.test(name) || typeof value !== "string" || /[\r\n]/.test(value)) {
                throw new Error(`refusing preset ${name}`);
              }
              fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
              console.log(`${name}=${value}`);
            }'

      - name: run cargo bench
        id: run
        run: ./scripts/bench/run-bench.sh "${WASMCLOUD_BENCH_NAME}"

      # Subsequent steps inherit the implicit `if: success()` — they only
      # run when every preceding step succeeded.
      - name: render markdown summary
        run: |
          # Each `run:` step gets a fresh shell — PATH from previous steps
          # doesn't persist — so re-source rustup's env shim before cargo.
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          cargo run -p bench-tools --quiet -- summary --bench "${WASMCLOUD_BENCH_NAME}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: upload bench artifact
        if: ${{ !cancelled() && (success() || (inputs.bench == 'memory_pressure' && steps.run.outcome == 'failure')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ inputs.name || inputs.bench }}-${{ github.run_id }}
          # criterion benches write to target/criterion/, gungraun benches
          # (gungraun) write to target/gungraun/, density benches to
          # target/density/. A genuinely-empty run is a bug worth flagging
          # loudly — fail rather than warn.
          path: |
            ${{ env.CARGO_TARGET_DIR }}/criterion/
            ${{ env.CARGO_TARGET_DIR }}/gungraun/
            ${{ env.CARGO_TARGET_DIR }}/density/
          retention-days: 90
          if-no-files-found: error

      # Package results without AWS credentials. Pull-request refs and runs
      # called with `publish: false` keep their summary and artifact but do
      # not enter the public history.
      - name: checkout workflow tools
        if: ${{ success() && inputs.publish && !startsWith(inputs.ref, 'pull/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .bench-publish-tools
          persist-credentials: false

      - name: prepare publish artifact
        if: ${{ success() && inputs.publish && !startsWith(inputs.ref, 'pull/') }}
        env:
          BUNDLE_DIR: ${{ runner.temp }}/bench-publish
        run: node .bench-publish-tools/.github/scripts/bench-push-results.mjs prepare "$BUNDLE_DIR"

      - name: upload publish artifact
        if: ${{ success() && inputs.publish && !startsWith(inputs.ref, 'pull/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-publish-${{ inputs.artifact_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-publish/
          retention-days: 7
          if-no-files-found: error

      - name: remove run log
        if: ${{ always() }}
        run: rm -f "$CARGO_TARGET_DIR/run-${WASMCLOUD_BENCH_NAME}-${GITHUB_RUN_ID}.log"

      - name: stop pressure-test Docker daemon
        if: ${{ always() && inputs.bench == 'memory_pressure' }}
        run: |
          docker ps -aq --filter label=wasmcloud.bench=memory_pressure | xargs -r docker rm --force
          sudo systemctl stop docker.service

  publish:
    needs: bench
    if: ${{ inputs.publish && !startsWith(inputs.ref, 'pull/') }}
    name: publish ${{ inputs.bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: download publish artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-publish-${{ inputs.artifact_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-publish

      - name: validate publish artifact
        env:
          WASMCLOUD_BENCH_NAME: ${{ inputs.bench }}
          WASMCLOUD_BENCH_REF: ${{ inputs.ref }}
          WASMCLOUD_BENCH_SHA: ${{ inputs.commit_sha }}
          BUNDLE_DIR: ${{ runner.temp }}/bench-publish
        run: node .github/scripts/bench-push-results.mjs validate "$BUNDLE_DIR"

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ secrets.aws_region }}

      - name: push results to s3 + invalidate CloudFront
        env:
          WASMCLOUD_BENCH_NAME: ${{ inputs.bench }}
          WASMCLOUD_BENCH_REF: ${{ inputs.ref }}
          WASMCLOUD_BENCH_SHA: ${{ inputs.commit_sha }}
          WASMCLOUD_BENCH_S3_BUCKET: ${{ secrets.s3_bucket }}
          WASMCLOUD_BENCH_CF_DISTRIBUTION_ID: ${{ secrets.cf_distribution_id }}
          BUNDLE_DIR: ${{ runner.temp }}/bench-publish
        run: node .github/scripts/bench-push-results.mjs publish "$BUNDLE_DIR"
