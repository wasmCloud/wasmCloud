name: k6bench run

on:
  workflow_call:
    inputs:
      run:
        required: true
        type: string
      ref:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      release:
        required: true
        type: string
      rate:
        required: true
        type: string
      duration:
        required: true
        type: string
      raw:
        required: true
        type: boolean
    secrets:
      aws_role_arn:
        required: true
      aws_region:
        required: true
      s3_bucket:
        required: true
      cf_distribution_id:
        required: true

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  k6:
    name: ${{ inputs.run }}
    runs-on: [self-hosted, bench, hetzner]
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: /var/lib/bench/target
      CARGO_INCREMENTAL: "0"
      WASMCLOUD_BENCH_REF: ${{ inputs.ref }}
      RUN: ${{ inputs.run }}
      INPUT_RATE: ${{ inputs.rate || '1000' }}
      INPUT_DURATION: ${{ inputs.duration || '3m' }}
      INPUT_RAW: ${{ inputs.raw && '1' || '0' }}
      RELEASE: ${{ inputs.release }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          # The job runs the checked-out ref's code; keep the token out of it.
          persist-credentials: false

      - name: verify commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: pre-flight host checks
        env:
          WASMCLOUD_BENCH_HOSTNAME: ${{ vars.WASMCLOUD_BENCH_HOSTNAME }}
          WASMCLOUD_BENCH_K6: "1"
        run: node .github/scripts/bench-preflight.mjs

      - name: run k6 scenario
        id: run
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          IFS=: read -r scenario profile routing <<<"$RUN"
          routing="${routing:-local}"
          name="${scenario}-${profile}"
          [ "$routing" = local ] || name="${name}-${routing}"
          out="${RUNNER_TEMP}/k6bench/${name}"
          args=(--ci --scenario "$scenario" --profile "$profile" --routing "$routing"
                --rate "$INPUT_RATE" --duration "$INPUT_DURATION" --out-dir "$out")
          [ "$INPUT_RAW" = 1 ] && args+=(--raw)
          if [ "$RELEASE" = true ]; then
            args+=(--wasmcloud-version "${WASMCLOUD_BENCH_REF#v}")
          else
            args+=(--build-local)
          fi
          ./scripts/k6bench/run.sh "${args[@]}"
          {
            echo "dir=${out}"
            echo "name=k6-${name}"
          } >> "$GITHUB_OUTPUT"

      - name: render markdown summary
        env:
          RESULTS_DIR: ${{ steps.run.outputs.dir }}
        run: |
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          cargo run -p bench-tools --quiet -- k6 report --markdown "$RESULTS_DIR" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: upload k6bench artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.run.outputs.name }}-${{ github.run_id }}
          path: ${{ steps.run.outputs.dir }}
          retention-days: 90
          if-no-files-found: error

      # Pull-request refs keep their summary and artifact but do not enter
      # the public history.
      - name: checkout workflow tools
        if: ${{ success() && !startsWith(inputs.ref, 'pull/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .bench-publish-tools
          persist-credentials: false

      - name: prepare publish artifact
        if: ${{ success() && !startsWith(inputs.ref, 'pull/') }}
        env:
          WASMCLOUD_BENCH_NAME: ${{ steps.run.outputs.name }}
          WASMCLOUD_BENCH_K6_DIR: ${{ steps.run.outputs.dir }}
          BUNDLE_DIR: ${{ runner.temp }}/bench-publish
        run: node .bench-publish-tools/.github/scripts/bench-push-results.mjs prepare "$BUNDLE_DIR"

      - name: upload publish artifact
        if: ${{ success() && !startsWith(inputs.ref, 'pull/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-publish-${{ inputs.artifact_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-publish/
          retention-days: 7
          if-no-files-found: error

      # run.sh --ci deletes the cluster itself; this covers a job that failed
      # or was cancelled before it got there, so the next job's pre-flight
      # (and the criterion benches) find an idle host.
      - name: delete kind cluster
        if: ${{ always() }}
        run: kind delete cluster --name k6bench || true

      # Docker is socket-activated; stopping the daemon returns the host to
      # how criterion and gungraun expect it (their pre-flight refuses a
      # running daemon). The sudoers rule is installed by install-runner.sh.
      - name: stop docker
        if: ${{ always() }}
        run: sudo -n systemctl stop docker.service

  publish:
    needs: k6
    if: ${{ !startsWith(inputs.ref, 'pull/') }}
    name: publish ${{ inputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: download publish artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-publish-${{ inputs.artifact_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-publish

      - name: expected bench name
        id: name
        env:
          RUN: ${{ inputs.run }}
        run: |
          IFS=: read -r scenario profile routing <<<"$RUN"
          name="k6-${scenario}-${profile}"
          [ "${routing:-local}" = local ] || name="${name}-${routing}"
          echo "bench=${name}" >> "$GITHUB_OUTPUT"

      - name: validate publish artifact
        env:
          WASMCLOUD_BENCH_NAME: ${{ steps.name.outputs.bench }}
          WASMCLOUD_BENCH_ROW_NAME: k6
          WASMCLOUD_BENCH_REF: ${{ inputs.ref }}
          WASMCLOUD_BENCH_SHA: ${{ inputs.commit_sha }}
          BUNDLE_DIR: ${{ runner.temp }}/bench-publish
        run: node .github/scripts/bench-push-results.mjs validate "$BUNDLE_DIR"

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ secrets.aws_region }}

      - name: push results to s3 + invalidate CloudFront
        env:
          WASMCLOUD_BENCH_NAME: ${{ steps.name.outputs.bench }}
          WASMCLOUD_BENCH_ROW_NAME: k6
          WASMCLOUD_BENCH_REF: ${{ inputs.ref }}
          WASMCLOUD_BENCH_SHA: ${{ inputs.commit_sha }}
          WASMCLOUD_BENCH_S3_BUCKET: ${{ secrets.s3_bucket }}
          WASMCLOUD_BENCH_CF_DISTRIBUTION_ID: ${{ secrets.cf_distribution_id }}
          BUNDLE_DIR: ${{ runner.temp }}/bench-publish
        run: node .github/scripts/bench-push-results.mjs publish "$BUNDLE_DIR"
