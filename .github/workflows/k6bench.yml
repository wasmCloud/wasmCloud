name: k6bench

# System-level load tests (scripts/k6bench) on the Hetzner bench host: a kind
# cluster running the runtime-operator chart, driven by k6. Sibling of
# bench.yml, which measures wash-runtime in-process; see
# scripts/k6bench/README.md.
#
# Runs only on a published release and on demand. Never on push or PR: the
# bench host is a self-hosted runner and this job runs the checked-out ref's
# code on it (scripts/bench/README.md §9.4).
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: which scenario to run (release-set = the release matrix)
        type: choice
        default: http-hello
        options:
          - http-hello
          - fan-out-10
          - chain-5
          - many-workloads
          - release-set
      profile:
        description: load profile (ignored for release-set)
        type: choice
        default: constant
        options:
          - constant
          - stress
          - spike
      rate:
        description: requests/s for constant and spike
        type: string
        default: "1000"
      duration:
        description: measured window, e.g. 3m
        type: string
        default: "3m"
      ref:
        description: "git ref to bench (branch, tag, sha, or #PR; default = the workflow ref)"
        type: string
        default: ""
      raw:
        description: also archive k6's per-request stream (large)
        type: boolean
        default: false
  release:
    types: [published]

defaults:
  run:
    shell: bash

# Not bench.yml's `bench-host` group: a release fires both workflows, and
# GitHub keeps only one pending run per group, so a dispatch arriving during
# the release run would cancel a queued release run. The single self-hosted
# runner already serializes jobs, and its queue never drops one.
concurrency:
  group: bench-host-k6
  cancel-in-progress: false

permissions: {}

jobs:
  # `scenario:profile` pairs to run, and the ref, from the trigger. Mirrors
  # bench.yml's matrix job, including its pull-request ref spellings.
  matrix:
    name: build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      runs: ${{ steps.set.outputs.runs }}
      ref: ${{ steps.set.outputs.ref }}
      checkout_ref: ${{ steps.set.outputs.checkout_ref }}
      release: ${{ steps.set.outputs.release }}
    env:
      # What every release publishes to the timeline. stress gives the
      # headline max_sustainable_rps; the constant runs give p99 at a fixed
      # rate, which is what compares release to release.
      RELEASE_RUNS: '["http-hello:constant","http-hello:stress","fan-out-10:constant","many-workloads:constant"]'
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            runs="${RELEASE_RUNS}"
            ref="${RELEASE_TAG}"
            checkout_ref="${RELEASE_TAG}"
          else
            if [ "$INPUT_SCENARIO" = "release-set" ]; then
              runs="${RELEASE_RUNS}"
            else
              runs="[\"${INPUT_SCENARIO}:${INPUT_PROFILE}\"]"
            fi
            ref="${INPUT_REF:-${DEFAULT_REF}}"
            ref="${ref#refs/heads/}"; ref="${ref#refs/tags/}"
            checkout_ref="${ref}"
            case "$ref" in
              '#'* | pull/* | pr/*)
                num="${ref#\#}"; num="${num#pull/}"; num="${num#pr/}"
                if ! [[ "$num" =~ ^[0-9]+$ ]]; then
                  echo "invalid pull-request ref '${ref}' (expected #N, pull/N, or pr/N)" >&2
                  exit 1
                fi
                ref="pull/${num}"
                checkout_ref="refs/pull/${num}/head"
                ;;
            esac
          fi
          # A release tag runs the images published for it; anything else is
          # built from the checkout on the bench host.
          release=false
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && release=true
          {
            echo "runs=${runs}"
            echo "ref=${ref}"
            echo "checkout_ref=${checkout_ref}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

  k6:
    needs: matrix
    name: ${{ matrix.run }}
    runs-on: [self-hosted, bench, hetzner]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write   # OIDC token for AWS role assumption
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run: ${{ fromJSON(needs.matrix.outputs.runs) }}
    env:
      CARGO_TARGET_DIR: /var/lib/bench/target
      CARGO_INCREMENTAL: "0"
      WASMCLOUD_BENCH_REF: ${{ needs.matrix.outputs.ref }}
      RUN: ${{ matrix.run }}
      INPUT_RATE: ${{ inputs.rate || '1000' }}
      INPUT_DURATION: ${{ inputs.duration || '3m' }}
      INPUT_RAW: ${{ inputs.raw && '1' || '0' }}
      RELEASE: ${{ needs.matrix.outputs.release }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.matrix.outputs.checkout_ref }}
          fetch-depth: 0
          # The job runs the checked-out ref's code; keep the token out of it.
          persist-credentials: false

      - name: pre-flight host checks
        env:
          WASMCLOUD_BENCH_HOSTNAME: ${{ vars.WASMCLOUD_BENCH_HOSTNAME }}
          WASMCLOUD_BENCH_K6: "1"
        run: node .github/scripts/bench-preflight.mjs

      - name: run k6 scenario
        id: run
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          scenario="${RUN%%:*}"
          profile="${RUN##*:}"
          out="${RUNNER_TEMP}/k6bench/${scenario}-${profile}"
          args=(--ci --scenario "$scenario" --profile "$profile"
                --rate "$INPUT_RATE" --duration "$INPUT_DURATION" --out-dir "$out")
          [ "$INPUT_RAW" = 1 ] && args+=(--raw)
          if [ "$RELEASE" = true ]; then
            args+=(--wasmcloud-version "${WASMCLOUD_BENCH_REF#v}")
          else
            args+=(--build-local)
          fi
          ./scripts/k6bench/run.sh "${args[@]}"
          {
            echo "dir=${out}"
            echo "name=k6-${scenario}-${profile}"
          } >> "$GITHUB_OUTPUT"

      - name: render markdown summary
        env:
          RESULTS_DIR: ${{ steps.run.outputs.dir }}
        run: |
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          cargo run -p bench-tools --quiet -- k6 report --markdown "$RESULTS_DIR" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: upload k6bench artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.run.outputs.name }}-${{ github.run_id }}
          path: ${{ steps.run.outputs.dir }}
          retention-days: 90
          if-no-files-found: error

      # A pull-request ref gets a summary and an artifact but never reaches S3,
      # for the reasons spelled out in bench.yml.
      - name: configure aws credentials
        if: ${{ success() && !startsWith(needs.matrix.outputs.ref, 'pull/') }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.WASMCLOUD_BENCH_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.WASMCLOUD_BENCH_S3_REGION }}

      - name: push results to s3 + invalidate CloudFront
        if: ${{ success() && !startsWith(needs.matrix.outputs.ref, 'pull/') }}
        env:
          WASMCLOUD_BENCH_NAME: ${{ steps.run.outputs.name }}
          WASMCLOUD_BENCH_K6_DIR: ${{ steps.run.outputs.dir }}
          WASMCLOUD_BENCH_S3_BUCKET: ${{ secrets.WASMCLOUD_BENCH_S3_BUCKET }}
          WASMCLOUD_BENCH_CF_DISTRIBUTION_ID: ${{ secrets.WASMCLOUD_BENCH_CF_DISTRIBUTION_ID }}
        run: node .github/scripts/bench-push-results.mjs

      # run.sh --ci deletes the cluster itself; this covers a job that failed
      # or was cancelled before it got there, so the next job's pre-flight
      # (and the criterion benches) find an idle host.
      - name: delete kind cluster
        if: ${{ always() }}
        run: kind delete cluster --name k6bench || true

      # Docker is socket-activated; stopping the daemon returns the host to
      # how criterion and gungraun expect it (their pre-flight refuses a
      # running daemon). The sudoers rule is installed by install-runner.sh.
      - name: stop docker
        if: ${{ always() }}
        run: sudo -n systemctl stop docker.service
