name: k6bench

# System-level load tests (scripts/k6bench) on the Hetzner bench host: a kind
# cluster running the runtime-operator chart, driven by k6. Sibling of
# bench.yml, which measures wash-runtime in-process; see
# scripts/k6bench/README.md.
#
# Runs only on a published release and on demand. Never on push or PR: the
# bench host is a self-hosted runner and this job runs the checked-out ref's
# code on it (scripts/bench/README.md §9.4).
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: which scenario to run (release-set = the release matrix)
        type: choice
        default: http-hello
        options:
          - http-hello
          - fan-out-10
          - chain-5
          - many-workloads
          - release-set
      profile:
        description: load profile (ignored for release-set)
        type: choice
        default: constant
        options:
          - constant
          - stress
          - spike
      routing:
        description: "fan-out-10 and chain-5: local (same-host local routing), network (Service DNS), or both (ignored for release-set)"
        type: choice
        default: local
        options:
          - local
          - network
          - both
      rate:
        description: requests/s for constant and spike
        type: string
        default: "1000"
      duration:
        description: measured window, e.g. 3m
        type: string
        default: "3m"
      ref:
        description: "git ref to bench (branch, tag, sha, or #PR; default = the workflow ref)"
        type: string
        default: ""
      raw:
        description: also archive k6's per-request stream (large)
        type: boolean
        default: false
  release:
    types: [published]

defaults:
  run:
    shell: bash

# No concurrency group: GitHub keeps only one pending run per group, so a
# dispatch would cancel a queued release run. The single self-hosted runner
# already serializes jobs, and its queue never drops one.

permissions: {}

jobs:
  # `scenario:profile` pairs to run, and the ref, from the trigger. Mirrors
  # bench.yml's matrix job, including its pull-request ref spellings.
  matrix:
    name: build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runs: ${{ steps.set.outputs.runs }}
      ref: ${{ steps.set.outputs.ref }}
      release: ${{ steps.set.outputs.release }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      # What every release publishes to the timeline, as
      # `scenario:profile[:routing]`. stress gives the headline
      # max_sustainable_rps; the constant runs give p99 at a fixed rate, which
      # is what compares release to release. The call-graph scenarios run with
      # and without local routing, so the timeline shows what it saves.
      RELEASE_RUNS: '["http-hello:constant","http-hello:stress","fan-out-10:constant:local","fan-out-10:constant:network","chain-5:constant:local","chain-5:constant:network","many-workloads:constant"]'
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_ROUTING: ${{ inputs.routing }}
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            runs="${RELEASE_RUNS}"
            ref="${RELEASE_TAG}"
            checkout_ref="${RELEASE_TAG}"
          else
            if [ "$INPUT_SCENARIO" = "release-set" ]; then
              runs="${RELEASE_RUNS}"
            else
              case "${INPUT_SCENARIO}:${INPUT_ROUTING}" in
                fan-out-10:both | chain-5:both)
                  runs="[\"${INPUT_SCENARIO}:${INPUT_PROFILE}:local\",\"${INPUT_SCENARIO}:${INPUT_PROFILE}:network\"]" ;;
                fan-out-10:* | chain-5:*)
                  runs="[\"${INPUT_SCENARIO}:${INPUT_PROFILE}:${INPUT_ROUTING}\"]" ;;
                *)
                  runs="[\"${INPUT_SCENARIO}:${INPUT_PROFILE}\"]" ;;
              esac
            fi
            ref="${INPUT_REF:-${DEFAULT_REF}}"
            ref="${ref#refs/heads/}"; ref="${ref#refs/tags/}"
            checkout_ref="${ref}"
            case "$ref" in
              '#'* | pull/* | pr/*)
                num="${ref#\#}"; num="${num#pull/}"; num="${num#pr/}"
                if ! [[ "$num" =~ ^[0-9]+$ ]]; then
                  echo "invalid pull-request ref '${ref}' (expected #N, pull/N, or pr/N)" >&2
                  exit 1
                fi
                ref="pull/${num}"
                checkout_ref="refs/pull/${num}/head"
                ;;
            esac
          fi
          # A release tag runs the images published for it; anything else is
          # built from the checkout on the bench host.
          release=false
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && release=true
          {
            echo "runs=${runs}"
            echo "ref=${ref}"
            echo "checkout_ref=${checkout_ref}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

      - name: resolve commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.set.outputs.checkout_ref }}
          persist-credentials: false

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  k6:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.matrix.outputs.runs) }}
    uses: $/.github/workflows/k6bench-run.yml
    permissions:
      contents: read
      id-token: write
    with:
      run: ${{ matrix.run }}
      ref: ${{ needs.matrix.outputs.ref }}
      commit_sha: ${{ needs.matrix.outputs.sha }}
      artifact_id: ${{ format('{0}', strategy.job-index) }}
      release: ${{ needs.matrix.outputs.release }}
      rate: ${{ inputs.rate || '1000' }}
      duration: ${{ inputs.duration || '3m' }}
      raw: ${{ inputs.raw || false }}
    secrets:
      aws_role_arn: ${{ secrets.WASMCLOUD_BENCH_AWS_ROLE_ARN }}
      aws_region: ${{ secrets.WASMCLOUD_BENCH_S3_REGION }}
      s3_bucket: ${{ secrets.WASMCLOUD_BENCH_S3_BUCKET }}
      cf_distribution_id: ${{ secrets.WASMCLOUD_BENCH_CF_DISTRIBUTION_ID }}
