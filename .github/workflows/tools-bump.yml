name: tools-bump

# Opens a PR when a tracked upstream tool publishes a new stable GitHub
# release. The pinned versions live in .github/tool-versions.env:
#   - wasm-tools (bytecodealliance/wasm-tools), consumed by wit.yml
#   - protoc (protocolbuffers/protobuf), consumed by the setup-protoc action
#   - cargo-llvm-cov (taiki-e/cargo-llvm-cov), consumed by coverage.yml
#
# Why this exists: Dependabot's `github-actions` ecosystem tracks `uses:`
# refs (the action SHA), not arbitrary `with:` inputs or versions fetched
# at runtime. These tools are installed by version string rather than a
# pinned `uses:`, so they're invisible to Dependabot and we maintain them
# with a small custom updater.
#
# wash is installed via wasmcloud/setup-wash-action (which defaults to
# the latest wash release) and is not tracked here.
#
# The PR is opened with a short-lived octo-sts token (trust policy in
# .github/chainguard/tools-bump.sts.yaml) rather than GITHUB_TOKEN. The
# repo does not allow GITHUB_TOKEN to create pull requests, and PRs opened
# by GITHUB_TOKEN would not trigger the workflows that consume these pins
# (wit.yml, wash.yml, examples.yml, codeql.yml).

on:
  schedule:
    # Monday 14:00 UTC.
    - cron: '0 14 * * 1'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get a PR token from octo-sts
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: tools-bump

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest tool versions and apply bumps
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/bump-tool-versions.mjs

      - name: Open / update PR
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          branch: bump/tool-versions
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: true
          title: 'ci: bump pinned CI tool versions'
          commit-message: |
            ci: bump pinned CI tool versions

            ${{ steps.update.outputs.body }}
          labels: |
            dependencies
            github-actions
          body: |
            Bumps the CI pipeline's pinned tool versions (wasm-tools, protoc, cargo-llvm-cov) to upstream's latest stable releases.

            ${{ steps.update.outputs.body }}
