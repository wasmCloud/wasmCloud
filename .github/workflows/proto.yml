name: proto

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'runtime-operator/buf.yaml'
              - 'runtime-operator/buf.gen.yaml'
              - '.github/workflows/proto.yml'
              # The Rust bindings under crates/wash-runtime are committed
              # output of `cargo xtask generate-protos`, so anything that
              # feeds that generator changes them: the xtask itself, the
              # pinned protoc, the toolchain, and the generator crate
              # versions in Cargo.lock.
              - 'crates/wash-runtime/src/washlet/generated/**'
              - 'xtask/**'
              - '.github/actions/setup-protoc/**'
              - '.github/actions/setup-rust/**'
              - '.github/tool-versions.env'
              - 'rust-toolchain.toml'
              - 'Cargo.lock'

  lint:
    needs:
      - changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: false

  check-generated:
    needs:
      - changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - name: Generate protobuf definitions
        run: |
          buf generate
      - name: "Verify no protobuf changes"
        uses: ./.github/actions/no-diff
        with:
          fixup-command: "buf generate"

  # The Rust counterpart of check-generated. The wasmcloud.runtime.v2
  # bindings under crates/wash-runtime are committed (generated by `cargo
  # xtask generate-protos`) so the crate packages and builds without protoc
  # or the workspace /proto dir. Regenerate and fail on any difference.
  #
  # Expect this to go red on a protoc or generator-crate bump as well as on
  # a .proto edit: the output is a function of both. Either way the fix is
  # to rerun the task and commit the result.
  check-generated-rust:
    needs:
      - changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup protoc
        uses: ./.github/actions/setup-protoc
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Regenerate protobuf bindings
        run: cargo xtask generate-protos
      - name: "Verify no protobuf changes"
        uses: ./.github/actions/no-diff
        with:
          fixup-command: "cargo xtask generate-protos"

  gate:
    needs:
      - lint
      - check-generated
      - check-generated-rust
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
