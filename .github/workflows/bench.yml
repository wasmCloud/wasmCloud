name: bench

on:
  workflow_dispatch:
    inputs:
      bench:
        description: which bench to run
        type: choice
        default: http_invoke
        options:
          - http_invoke
          - service_http
          - gungraun
          - wasmtime_baseline
          - wasmtime_serve
          - gungraun_plugin
          - scale_density
          # scale_density with the settings in BENCH_VARIANTS below.
          - max_scale
      ref:
        description: "git ref to bench (branch, tag, sha, or #PR; default = the workflow ref)"
        type: string
        default: ""
  # Auto-populate the releases timeline: when a tag is published, run the
  # subset of benches that actually track wash-runtime regressions against
  # that exact tag. The site filters rows by `ref` to render the
  # semver-ordered releases view.
  #
  # The release subset is intentionally narrower than the `inputs.bench`
  # choice list — see RELEASE_BENCHES below.
  release:
    types: [published]

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  # Compute the matrix shape from the trigger:
  #   - workflow_dispatch: a one-element matrix (just inputs.bench, or the
  #                        bench and environment a BENCH_VARIANTS name stands for)
  #   - release:           a matrix of $RELEASE_BENCHES (the reference
  #                        subset we track on the releases timeline)
  # The dispatch path keeps the one-bench UX so a maintainer can compare
  # an arbitrary bench (incl. wasmtime_*) against a ref; the release path
  # restricts to benches that actually move with wash-runtime changes so
  # a published tag doesn't tie up the bench host for ~4h.
  matrix:
    name: build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # One entry per bench job: {name, bench, env, publish}.
      runs: ${{ steps.set.outputs.runs }}
      # `ref` labels each data row; the matrix checkout resolves the commit.
      # Pull-request labels use `pull/123`, while checkout uses the full ref.
      ref: ${{ steps.set.outputs.ref }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      # Subset of inputs.bench.options to run automatically on `release:
      # published`. wasmtime_* are reference baselines for wasmtime itself
      # and don't shift with our changes — run them on demand via
      # workflow_dispatch when wasmtime is upgraded.
      RELEASE_BENCHES: '["http_invoke","service_http","gungraun"]'
      # Named runs of an existing bench with environment variables preset,
      # for settings a bench reads from its environment:
      #
      # - `bench` is the bench that runs, `env` what it runs with.
      # - Dispatch-only: never in the release subset.
      # - Never published. On a ref whose bench ignores the variables, the
      #   rows would be indistinguishable from the bench's own series.
      #
      # max_scale: each guest memory's reservation and guard shrunk, past
      # the ~16,000 warm instances the address space holds at wasmtime's
      # 4 GiB + 32 MiB (WASH_SCALE_MEMORY_RESERVATION and
      # WASH_SCALE_MEMORY_GUARD; a ref without them runs plain scale_density).
      BENCH_VARIANTS: >-
        {"max_scale": {"bench": "scale_density",
                       "env": {"WASH_SCALE_MEMORY_RESERVATION": "256MiB",
                               "WASH_SCALE_MEMORY_GUARD": "64KiB"}}}
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BENCH: ${{ inputs.bench }}
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            runs="$(jq -cn --argjson benches "$RELEASE_BENCHES" \
              '[$benches[] | {name: ., bench: ., env: {}, publish: true}]')"
            ref="${RELEASE_TAG}"
            checkout_ref="${RELEASE_TAG}"
          else
            runs="$(jq -cn --arg name "$INPUT_BENCH" --argjson variants "$BENCH_VARIANTS" '
              if $variants[$name] then
                [{name: $name, bench: $variants[$name].bench,
                  env: $variants[$name].env, publish: false}]
              else
                [{name: $name, bench: $name, env: {}, publish: true}]
              end')"
            ref="${INPUT_REF:-${DEFAULT_REF}}"
            # Normalize to the short name (main, v2.5.2) so it matches
            # GITHUB_REF_NAME's style and, when it's a tag, passes the
            # releases view's strict-semver ref filter.
            ref="${ref#refs/heads/}"; ref="${ref#refs/tags/}"
            checkout_ref="${ref}"
            case "$ref" in
              '#'* | pull/* | pr/*)
                # Same spellings compare-bench.sh's resolve_sha accepts, so
                # `#123` means the same thing in both bench workflows.
                #
                # GitHub publishes refs/pull/N/head on the base repo for fork
                # PRs too, so actions/checkout fetches it directly.
                num="${ref#\#}"; num="${num#pull/}"; num="${num#pr/}"
                if ! [[ "$num" =~ ^[0-9]+$ ]]; then
                  echo "invalid pull-request ref '${ref}' (expected #N, pull/N, or pr/N)" >&2
                  exit 1
                fi
                # The row is labelled `pull/N` rather than refs/pull/N/head:
                # `sha` on the same row already pins the exact commit, so the
                # label only has to say which PR it came from.
                ref="pull/${num}"
                checkout_ref="refs/pull/${num}/head"
                ;;
            esac
          fi
          {
            echo "runs=${runs}"
            echo "ref=${ref}"
            echo "checkout_ref=${checkout_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: resolve commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.set.outputs.checkout_ref }}
          persist-credentials: false

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  bench:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.matrix.outputs.runs) }}
    uses: $/.github/workflows/bench-run.yml
    permissions:
      contents: read
      id-token: write
    with:
      bench: ${{ matrix.run.bench }}
      name: ${{ matrix.run.name }}
      env: ${{ toJSON(matrix.run.env) }}
      publish: ${{ matrix.run.publish }}
      ref: ${{ needs.matrix.outputs.ref }}
      commit_sha: ${{ needs.matrix.outputs.sha }}
      artifact_id: ${{ format('{0}', strategy.job-index) }}
    secrets:
      aws_role_arn: ${{ secrets.WASMCLOUD_BENCH_AWS_ROLE_ARN }}
      aws_region: ${{ secrets.WASMCLOUD_BENCH_S3_REGION }}
      s3_bucket: ${{ secrets.WASMCLOUD_BENCH_S3_BUCKET }}
      cf_distribution_id: ${{ secrets.WASMCLOUD_BENCH_CF_DISTRIBUTION_ID }}
