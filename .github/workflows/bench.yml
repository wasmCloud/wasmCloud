name: bench

on:
  workflow_dispatch:
    inputs:
      bench:
        description: which bench to run
        type: choice
        default: http_invoke
        options:
          - http_invoke
          - service_http
          - gungraun
          - wasmtime_baseline
          - wasmtime_serve
          - gungraun_plugin
      ref:
        description: "git ref to bench (branch, tag, sha, or #PR; default = the workflow ref)"
        type: string
        default: ""
  # Auto-populate the releases timeline: when a tag is published, run the
  # subset of benches that actually track wash-runtime regressions against
  # that exact tag. The site filters rows by `ref` to render the
  # semver-ordered releases view.
  #
  # The release subset is intentionally narrower than the `inputs.bench`
  # choice list — see RELEASE_BENCHES below.
  release:
    types: [published]

defaults:
  run:
    shell: bash

# Only one bench workflow can run on the host at a time. Queue rather than
# cancel so an in-flight bench is never interrupted partway through criterion
# sampling. Matrix jobs within a single run also serialize naturally because
# the host has exactly one self-hosted runner.
concurrency:
  group: bench-host
  cancel-in-progress: false

permissions: {}

jobs:
  # Compute the matrix shape from the trigger:
  #   - workflow_dispatch: a one-element matrix (just inputs.bench)
  #   - release:           a matrix of $RELEASE_BENCHES (the reference
  #                        subset we track on the releases timeline)
  # The dispatch path keeps the one-bench UX so a maintainer can compare
  # an arbitrary bench (incl. wasmtime_*) against a ref; the release path
  # restricts to benches that actually move with wash-runtime changes so
  # a published tag doesn't tie up the bench host for ~4h.
  matrix:
    name: build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      benches: ${{ steps.set.outputs.benches }}
      # `ref` is the label recorded on each data row; `checkout_ref` is what
      # actions/checkout is given. They differ only for a pull-request ref,
      # where the row says `pull/123` but the checkout needs the full
      # refs/pull/123/head.
      ref: ${{ steps.set.outputs.ref }}
      checkout_ref: ${{ steps.set.outputs.checkout_ref }}
    env:
      # Subset of inputs.bench.options to run automatically on `release:
      # published`. wasmtime_* are reference baselines for wasmtime itself
      # and don't shift with our changes — run them on demand via
      # workflow_dispatch when wasmtime is upgraded.
      RELEASE_BENCHES: '["http_invoke","service_http","gungraun"]'
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BENCH: ${{ inputs.bench }}
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            benches="${RELEASE_BENCHES}"
            ref="${RELEASE_TAG}"
            checkout_ref="${RELEASE_TAG}"
          else
            benches="[\"${INPUT_BENCH}\"]"
            ref="${INPUT_REF:-${DEFAULT_REF}}"
            # Normalize to the short name (main, v2.5.2) so it matches
            # GITHUB_REF_NAME's style and, when it's a tag, passes the
            # releases view's strict-semver ref filter.
            ref="${ref#refs/heads/}"; ref="${ref#refs/tags/}"
            checkout_ref="${ref}"
            case "$ref" in
              '#'* | pull/* | pr/*)
                # Same spellings compare-bench.sh's resolve_sha accepts, so
                # `#123` means the same thing in both bench workflows.
                #
                # GitHub publishes refs/pull/N/head on the base repo for fork
                # PRs too, so actions/checkout fetches it directly — no API
                # call, which keeps this job checkout-free at `permissions: {}`.
                num="${ref#\#}"; num="${num#pull/}"; num="${num#pr/}"
                if ! [[ "$num" =~ ^[0-9]+$ ]]; then
                  echo "invalid pull-request ref '${ref}' (expected #N, pull/N, or pr/N)" >&2
                  exit 1
                fi
                # The row is labelled `pull/N` rather than refs/pull/N/head:
                # `sha` on the same row already pins the exact commit, so the
                # label only has to say which PR it came from.
                ref="pull/${num}"
                checkout_ref="refs/pull/${num}/head"
                ;;
            esac
          fi
          {
            echo "benches=${benches}"
            echo "ref=${ref}"
            echo "checkout_ref=${checkout_ref}"
          } >> "$GITHUB_OUTPUT"

  bench:
    needs: matrix
    name: ${{ matrix.bench }}
    runs-on: [self-hosted, bench, hetzner]
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write   # OIDC token for AWS role assumption
    strategy:
      fail-fast: false
      # Redundant with the single-runner serialization, but documents intent.
      max-parallel: 1
      matrix:
        bench: ${{ fromJSON(needs.matrix.outputs.benches) }}
    env:
      WASMCLOUD_BENCH_NAME: ${{ matrix.bench }}
      # Persist the cargo build cache outside $GITHUB_WORKSPACE so
      # actions/checkout's clean step doesn't blow it away every run.
      CARGO_TARGET_DIR: /var/lib/bench/target
      CARGO_INCREMENTAL: "0"
      # The ref recorded on each data row — bench-tools/meta.rs reads this as
      # the single source of truth for what was benched. It's the resolved,
      # normalized matrix ref (the tag for `release`, the checked-out ref for a
      # dispatch). meta.rs deliberately ignores GITHUB_REF_NAME, which is the
      # *dispatch* ref (e.g. `main` even when the `ref` input is v2.5.2) and
      # would hide tag runs from the semver-filtered releases view.
      WASMCLOUD_BENCH_REF: ${{ needs.matrix.outputs.ref }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.matrix.outputs.checkout_ref }}
          fetch-depth: 0
          # Don't leave the GITHUB_TOKEN in .git/config; the bench host
          # then runs untrusted user code (the bench under test) and we
          # don't want it to be able to read or use the token.
          persist-credentials: false

      - name: pre-flight host checks
        env:
          # Expected hostname of the dedicated bench host. Set as a repo
          # variable (Settings → Secrets and variables → Actions → Variables).
          # Kept out of the repo so the box's identity isn't broadcast.
          WASMCLOUD_BENCH_HOSTNAME: ${{ vars.WASMCLOUD_BENCH_HOSTNAME }}
        run: node .github/scripts/bench-preflight.mjs

      - name: run cargo bench
        id: run
        run: ./scripts/bench/run-bench.sh "${WASMCLOUD_BENCH_NAME}"

      # Subsequent steps inherit the implicit `if: success()` — they only
      # run when every preceding step succeeded.
      - name: render markdown summary
        run: |
          # Each `run:` step gets a fresh shell — PATH from previous steps
          # doesn't persist — so re-source rustup's env shim before cargo.
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          cargo run -p bench-tools --quiet -- summary --bench "${WASMCLOUD_BENCH_NAME}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: upload bench artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ matrix.bench }}-${{ github.run_id }}
          # criterion benches write to target/criterion/, gungraun benches
          # (gungraun) write to target/gungraun/. A genuinely-empty run is
          # a bug worth flagging loudly — fail rather than warn.
          path: |
            ${{ env.CARGO_TARGET_DIR }}/criterion/
            ${{ env.CARGO_TARGET_DIR }}/gungraun/
          retention-days: 90
          if-no-files-found: error

      # A pull-request ref is benched for its step summary and artifact only —
      # it never reaches S3. Two reasons, both of which apply equally to the
      # raw-head-sha spelling that has always been possible here:
      #
      #   - The trends timeline tracks merged history. A PR row would sit in
      #     it labelled `pull/N` forever, describing code that may never land.
      #   - `cargo bench` has by this point run the ref's build scripts and
      #     proc macros on a persistent self-hosted host. Not assuming the AWS
      #     role afterwards keeps that code and these credentials in disjoint
      #     runs, rather than relying on it to have been well-behaved.
      - name: configure aws credentials
        if: ${{ success() && !startsWith(needs.matrix.outputs.ref, 'pull/') }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.WASMCLOUD_BENCH_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.WASMCLOUD_BENCH_S3_REGION }}

      - name: push results to s3 + invalidate CloudFront
        if: ${{ success() && !startsWith(needs.matrix.outputs.ref, 'pull/') }}
        env:
          WASMCLOUD_BENCH_S3_BUCKET: ${{ secrets.WASMCLOUD_BENCH_S3_BUCKET }}
          WASMCLOUD_BENCH_CF_DISTRIBUTION_ID: ${{ secrets.WASMCLOUD_BENCH_CF_DISTRIBUTION_ID }}
        run: node .github/scripts/bench-push-results.mjs
