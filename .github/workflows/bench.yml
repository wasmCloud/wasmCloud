name: bench

on:
  workflow_dispatch:
    inputs:
      bench:
        description: which bench to run
        type: choice
        default: http_invoke
        options:
          - http_invoke
          - service_http
          - gungraun
          - wasmtime_baseline
          - wasmtime_serve
          - ids
          - gungraun_plugin
          - scale_density
          - memory_pressure
          # scale_density with the settings in BENCH_VARIANTS below.
          - max_scale
          - million_warm
      ref:
        description: "git ref to bench (branch, tag, sha, or #PR; default = the workflow ref)"
        type: string
        default: ""
      args:
        description: "memory_pressure only: extra runner flags (e.g. --memory-mib 384 2048 --repeats 3)"
        type: string
        default: ""
      host:
        description: "runner label of the bench host (hetzner = the dedicated host)"
        type: string
        default: hetzner
  # Auto-populate the releases timeline: when a tag is published, run the
  # subset of benches that actually track wash-runtime regressions against
  # that exact tag. The site filters rows by `ref` to render the
  # semver-ordered releases view.
  #
  # The release subset is intentionally narrower than the `inputs.bench`
  # choice list — see RELEASE_BENCHES below.
  release:
    types: [published]

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  # Compute the matrix shape from the trigger:
  #   - workflow_dispatch: a one-element matrix (just inputs.bench, or the
  #                        bench and environment a BENCH_VARIANTS name stands for)
  #   - release:           a matrix of $RELEASE_BENCHES (the reference
  #                        subset we track on the releases timeline)
  # The dispatch path keeps the one-bench UX so a maintainer can compare
  # an arbitrary bench (incl. wasmtime_*) against a ref; the release path
  # restricts to benches that actually move with wash-runtime changes so
  # a published tag doesn't tie up the bench host for ~4h.
  matrix:
    name: build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # One entry per bench job: {name, bench, env, publish, group}.
      runs: ${{ steps.set.outputs.runs }}
      # `ref` labels each data row; the matrix checkout resolves the commit.
      # Pull-request labels use `pull/123`, while checkout uses the full ref.
      ref: ${{ steps.set.outputs.ref }}
      sha: ${{ steps.commit.outputs.sha }}
      args: ${{ steps.set.outputs.args }}
      host: ${{ steps.set.outputs.host }}
    env:
      # Subset of inputs.bench.options to run automatically on `release:
      # published`. wasmtime_* are reference baselines for wasmtime itself
      # and don't shift with our changes — run them on demand via
      # workflow_dispatch when wasmtime is upgraded.
      RELEASE_BENCHES: '["http_invoke","service_http","gungraun","max_scale"]'
      # Named runs of an existing bench with environment variables preset,
      # for settings a bench reads from its environment:
      #
      # - `bench` is the bench that runs, `env` what it runs with.
      # - Available to both dispatch and the release subset.
      # - Not published unless the preset names a `publish_group`: its rows
      #   then enter history under that group instead of the bench's own
      #   (`density` for scale_density), so they never mix with the bench's
      #   default series. Only density benches take a group. A preset
      #   without one stays unpublished: on a ref whose bench ignores the
      #   variables, its rows would be indistinguishable from the bench's.
      #
      # max_scale: warm and scale-to-zero with each guest memory's
      # reservation and guard shrunk, in growth mode, past
      # the ~16,000 warm instances the address space holds at wasmtime's
      # 4 GiB + 32 MiB (WASH_SCALE_MEMORY_RESERVATION and
      # WASH_SCALE_MEMORY_GUARD; a ref without them runs plain scale_density).
      #
      # million_warm: the densest settings measured on aws-c9g-16xlarge
      # (64 cores, 123 GiB, arm64's 256 TiB address space), for that host
      # only: about 1.4M warm workloads. Process memory raised from the
      # bench's 2 GiB default to 100 GiB, a 64 MiB + 64 KiB layout, a pool of
      # 1.6M memories, and growth mode with the uncharged-initial-memory cap
      # raised past 4x the guest budget. 100 GiB, not more, because the guard
      # leaves out page tables (~9 KiB a warm workload here) until the
      # footprint counts VmPTE; past it the kernel OOM-kills the bench. Needs
      # vm.max_map_count >= ~10M (provision.yml -e vm_max_map_count=16777216).
      # Published as group density-max, the record the density page shows.
      BENCH_VARIANTS: >-
        {"max_scale": {"bench": "scale_density",
                       "env": {"WASH_SCALE_MEMORY_RESERVATION": "256MiB",
                               "WASH_SCALE_MEMORY_GUARD": "64KiB",
                               "WASH_SCALE_GUEST_MEMORY_MODE": "growth",
                               "WASH_SCALE_MEMORY_LIMIT": "2GiB"}},
         "million_warm": {"bench": "scale_density",
                          "env": {"WASH_SCALE_MEMORY_RESERVATION": "64MiB",
                                  "WASH_SCALE_MEMORY_GUARD": "64KiB",
                                  "WASH_SCALE_GUEST_MEMORY_MODE": "growth",
                                  "WASH_SCALE_INITIAL_GUEST_MEMORY": "4TiB",
                                  "WASH_SCALE_MEMORY_LIMIT": "100GiB",
                                  "WASH_SCALE_MAX_MEMORIES": "1600000",
                                  "WASH_SCALE_STEP": "10000",
                                  "WASH_SCALE_MAX_SECS": "1800"},
                          "publish_group": "density-max"}}
      # Dispatch-only diagnostics whose results never enter the public
      # history. memory_pressure checks pass/fail outcomes; it has no trend.
      DIAGNOSTIC_BENCHES: '["memory_pressure"]'
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BENCH: ${{ inputs.bench }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ARGS: ${{ inputs.args }}
          INPUT_HOST: ${{ inputs.host }}
          DEFAULT_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Only memory_pressure's runner takes flags. Refuse them here,
          # before the job queues on the bench host, rather than drop them.
          args="${INPUT_ARGS:-}"
          if [ -n "$args" ]; then
            if [ "$INPUT_BENCH" != memory_pressure ]; then
              echo "args are only accepted for memory_pressure, not ${INPUT_BENCH}" >&2
              exit 1
            fi
            # Flags and values only; the runner validates the rest.
            if ! [[ "$args" =~ ^[A-Za-z0-9\ ._=-]+$ ]]; then
              echo "args may contain only letters, digits, spaces, and . _ = -" >&2
              exit 1
            fi
          fi
          # Release runs measure the dedicated host. Same shape as
          # bench-host.mjs's parseHostLabel.
          host="hetzner"
          [ "$EVENT" = "release" ] || host="${INPUT_HOST:-hetzner}"
          if ! [[ "$host" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "invalid host label '${host}'" >&2
            exit 1
          fi
          if [ "$EVENT" = "release" ]; then
            benches="$RELEASE_BENCHES"
            ref="${RELEASE_TAG}"
            checkout_ref="${RELEASE_TAG}"
          else
            benches="$(jq -cn --arg name "$INPUT_BENCH" '[$name]')"
            ref="${INPUT_REF:-${DEFAULT_REF}}"
            # Normalize to the short name (main, v2.5.2) so it matches
            # GITHUB_REF_NAME's style and, when it's a tag, passes the
            # releases view's strict-semver ref filter.
            ref="${ref#refs/heads/}"; ref="${ref#refs/tags/}"
            checkout_ref="${ref}"
            case "$ref" in
              '#'* | pull/* | pr/*)
                # Same spellings compare-bench.sh's resolve_sha accepts, so
                # `#123` means the same thing in both bench workflows.
                #
                # GitHub publishes refs/pull/N/head on the base repo for fork
                # PRs too, so actions/checkout fetches it directly.
                num="${ref#\#}"; num="${num#pull/}"; num="${num#pr/}"
                if ! [[ "$num" =~ ^[0-9]+$ ]]; then
                  echo "invalid pull-request ref '${ref}' (expected #N, pull/N, or pr/N)" >&2
                  exit 1
                fi
                # The row is labelled `pull/N` rather than refs/pull/N/head:
                # `sha` on the same row already pins the exact commit, so the
                # label only has to say which PR it came from.
                ref="pull/${num}"
                checkout_ref="refs/pull/${num}/head"
                ;;
            esac
          fi
          runs="$(jq -cn --argjson benches "$benches" --argjson variants "$BENCH_VARIANTS" \
            --argjson diagnostics "$DIAGNOSTIC_BENCHES" '
            [$benches[] as $name |
              if $variants[$name] then
                {name: $name, bench: $variants[$name].bench,
                 env: $variants[$name].env,
                 publish: ($variants[$name].publish_group != null),
                 group: ($variants[$name].publish_group // "")}
              else
                {name: $name, bench: $name, env: {},
                 publish: ($diagnostics | any(. == $name) | not), group: ""}
              end]')"
          {
            echo "runs=${runs}"
            echo "ref=${ref}"
            echo "checkout_ref=${checkout_ref}"
            echo "args=${args}"
            echo "host=${host}"
          } >> "$GITHUB_OUTPUT"

      - name: resolve commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.set.outputs.checkout_ref }}
          persist-credentials: false

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  bench:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.matrix.outputs.runs) }}
    uses: $/.github/workflows/bench-run.yml
    permissions:
      contents: read
      id-token: write
    with:
      bench: ${{ matrix.run.bench }}
      name: ${{ matrix.run.name }}
      env: ${{ toJSON(matrix.run.env) }}
      publish: ${{ matrix.run.publish }}
      group: ${{ matrix.run.group }}
      host: ${{ needs.matrix.outputs.host }}
      ref: ${{ needs.matrix.outputs.ref }}
      commit_sha: ${{ needs.matrix.outputs.sha }}
      args: ${{ needs.matrix.outputs.args }}
      artifact_id: ${{ format('{0}', strategy.job-index) }}
    secrets:
      aws_role_arn: ${{ secrets.WASMCLOUD_BENCH_AWS_ROLE_ARN }}
      aws_region: ${{ secrets.WASMCLOUD_BENCH_S3_REGION }}
      s3_bucket: ${{ secrets.WASMCLOUD_BENCH_S3_BUCKET }}
      cf_distribution_id: ${{ secrets.WASMCLOUD_BENCH_CF_DISTRIBUTION_ID }}
