[package]
name = "summarizer"
version = "0.0.0"
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { workspace = true, features = ["async-spawn", "inter-task-wakeup"] }
#candle-core = { version = "0.11.0", default-features = false }
#candle-core = { path = "/home/b/me/rust/ai/candle/candle-core", default-features = false }
candle-core = { git = "https://github.com/bharattech/candle", branch = "candle-core-enable-simd128-on-wasm32-wasip2", package = "candle-core", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
candle-transformers = { version = "0.11.0", default-features = false }
gemm = { version = "*", features = ["wasm-simd128-enable"], default-features = false }
tokenizers = { version = "0.23.1", default-features = false, features = ["unstable_wasm"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tinytemplate = "1.2.1"
serde = { version = "1.0", features = ["derive"] }