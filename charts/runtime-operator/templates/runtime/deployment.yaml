{{- $top := . }}
{{- range .Values.runtime.hostGroups }}
{{- $ns := default $top.Release.Namespace .namespace }}
{{- /* Per-hostgroup image: `.image.{registry,repository,tag}` override the
       chart-wide runtime.image, so one release can mix host versions (e.g. an
       all-features host for one group and the shipped image for another). */}}
{{- $hi := default (dict) .image }}
{{- $imgRegistry := $hi.registry | default $top.Values.runtime.image.registry | default $top.Values.global.image.registry }}
{{- $imgRepo := $hi.repository | default $top.Values.runtime.image.repository }}
{{- $imgTag := $hi.tag | default $top.Values.runtime.image.tag | default $top.Chart.AppVersion }}
{{- /* hostPlugins entries needing a `wash host` config file (--config) —
       config/configFrom/secretFrom/allowedHosts/allowedIpNameLookups have no
       `--host-plugin` CLI-arg equivalent (deliberately: a secret must never
       land on the command line). See host-plugin-config.yaml, which renders
       the ConfigMap this deployment mounts. */}}
{{- /* A host group's own `resources` replaces the chart-wide block wholesale
       (no merge), and carries the host knobs `defaultHeapMemory`,
       `coreInstances`, `guestMemoryMode` and `maxConcurrentStarts` alongside
       the Kubernetes requests/limits. */}}
{{- $resources := .resources | default $top.Values.runtime.resources | default dict }}
{{- /* Probes, unlike `resources`, merge per field: a group naming one timing
       keeps the chart-wide values for the rest. */}}
{{- /* The shutdown budget, checked rather than described: the host serves for
       `drainDelaySeconds`, then drains commands for up to 5s, and SIGKILL lands
       at `terminationGracePeriodSeconds` whatever it is doing. */}}
{{- $drain := int ($top.Values.runtime.drainDelaySeconds | default 0) }}
{{- if gt (add $drain 5) (int $top.Values.runtime.terminationGracePeriodSeconds) }}
{{- fail (printf "runtime.terminationGracePeriodSeconds (%v) is under drainDelaySeconds (%v) plus the 5s command drain; the host would be killed mid-shutdown" $top.Values.runtime.terminationGracePeriodSeconds $drain) }}
{{- end }}
{{- $probeArgs := dict "group" .probes "chart" $top.Values.runtime.probes }}
{{- /* The port the probes are answered on, merged per field like the timings
       beside it: a group may turn it off or move it without restating the
       chart-wide default. */}}
{{- $endpoint := include "runtime-operator.hostProbe" (merge (dict "name" "endpoint") $probeArgs) | fromJson }}
{{- /* The ports this chart renders itself. Claiming one again — as the other
       probe port, or under the group's `ports` — is caught here, because the
       API server rejects a duplicate containerPort by array index. */}}
{{- $groupName := .name }}
{{- $reserved := dict }}
{{- if and .http .http.enabled }}
{{- $_ := set $reserved (toString (int .http.port)) "http.port" }}
{{- end }}
{{- if $endpoint.enabled }}
{{- $probePort := toString (int $endpoint.port) }}
{{- if hasKey $reserved $probePort }}
{{- fail (printf "host group %s: probes.endpoint.port and http.port are both %v; the host would fail to bind the second" $groupName $endpoint.port) }}
{{- end }}
{{- $_ := set $reserved $probePort "probes.endpoint.port" }}
{{- end }}
{{- range .ports }}
{{- $port := toString (int .containerPort) }}
{{- $clash := index $reserved $port }}
{{- if $clash }}
{{- fail (printf "host group %s: ports[] re-lists containerPort %s, which the chart already renders from %s; drop it from ports[]" $groupName $port $clash) }}
{{- end }}
{{- end }}
{{- $liveness := include "runtime-operator.hostProbe" (merge (dict "name" "liveness") $probeArgs) | fromJson }}
{{- $readiness := include "runtime-operator.hostProbe" (merge (dict "name" "readiness") $probeArgs) | fromJson }}
{{- $partition := include "runtime-operator.hostPluginPartition" . | fromJson }}
{{- $cliPlugins := $partition.cli }}
{{- $needsConfigFile := $partition.needsConfigFile }}
{{- $configFromNames := $partition.configFromNames }}
{{- $secretFromNames := $partition.secretFromNames }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostgroup-{{ .name }}
  namespace: {{ $ns }}
  labels:
    wasmcloud.com/name: hostgroup
    wasmcloud.com/hostgroup: {{ .name }}
    {{- include "runtime-operator.labels" $top | nindent 4 }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      wasmcloud.com/name: hostgroup
      wasmcloud.com/hostgroup: {{ .name }}
  template:
    metadata:
      labels:
        wasmcloud.com/name: hostgroup
        wasmcloud.com/hostgroup: {{ .name }}
        {{- include "runtime.podLabels" $top | nindent 8 }}
      {{- /* The pod spec below is otherwise byte-identical across a
             hostPlugins config/configFrom/secretFrom edit — only the
             ConfigMap host-plugin-config.yaml renders changes — so without
             this checksum a `helm upgrade` re-renders the ConfigMap but
             never rolls the Deployment, and the host keeps serving the old
             config it read once at startup until an unrelated restart.

             Hashes the config file helper directly, for this group only:
             host-plugin-config.yaml ranges over every group, so hashing THAT
             template's output would give every group the same checksum and
             one group's edit would roll every host in the cluster.

             The reloader annotations cover what a checksum structurally
             cannot — the contents of the ConfigMaps/Secrets this file only
             references by name. See the helper. */}}
      {{- $annotations := dict }}
      {{- if $needsConfigFile }}
      {{- $configFile := include "runtime-operator.hostPluginConfigFile" $partition }}
      {{- $_ := set $annotations "checksum/host-plugin-config" ($configFile | sha256sum) }}
      {{- $reloader := include "runtime-operator.hostPluginReloaderAnnotations" $partition | fromYaml }}
      {{- $annotations = merge $annotations $reloader }}
      {{- end }}
      {{- with $top.Values.runtime.podAnnotations }}
      {{- $annotations = merge $annotations . }}
      {{- end }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ $top.Values.runtime.automountServiceAccountToken }}
      securityContext:
        {{- toYaml $top.Values.runtime.podSecurityContext | nindent 8 }}
      volumes:
        - name: oci-cache
          emptyDir: {}
        # wash creates its data/config/cache directories under $HOME (set to /tmp
        # below), so the host needs a writable /tmp to run with a read-only root
        # filesystem.
        - name: tmp
          emptyDir: {}
        {{- if $top.Values.global.tls.enabled }}
        - name: runtime-cert
          secret:
            secretName: {{ $top.Values.global.certificates.runtimeCertSecretName }}
        - name: data-cert
          secret:
            secretName: {{ $top.Values.global.certificates.dataCertSecretName }}
        {{- if and (.http) (.http.enabled) (.http.tls) (.http.tls.enabled) }}
        - name: tls-cert
          secret:
            secretName: {{ if and (.http.tls.certificate) (.http.tls.certificate.secretName) }}{{ .http.tls.certificate.secretName }}{{ else }}hostgroup-{{ .name }}-http-tls{{ end }}
        {{- end }}
        {{- end }}
        {{- /* Optional pod volumes (e.g. ConfigMap / Secret mounts). Rendered
               unconditionally — outside the global.tls.enabled guard above —
               so they survive a TLS-off install. */}}
        {{- with .volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $needsConfigFile }}
        - name: host-plugin-config
          configMap:
            name: hostgroup-{{ .name }}-host-config
        {{- range $configFromNames }}
        - name: host-plugin-config-{{ . }}
          configMap:
            name: {{ . }}
        {{- end }}
        {{- range $secretFromNames }}
        - name: host-plugin-secret-{{ . }}
          secret:
            secretName: {{ . }}
            # Matches the Kubernetes Secret volume `defaultMode: 0400` posture
            # `crate::workload`'s own `file:` secret handling documents.
            defaultMode: 0400
        {{- end }}
        {{- end }}
      serviceAccountName: {{ include "runtime.serviceAccountName" $top }}
      {{- include "runtime-operator.imagePullSecrets" $top | nindent 6 }}
      containers:
        - name: host
          image: {{ if $imgRegistry }}{{ printf "%s/%s" $imgRegistry $imgRepo }}{{ else }}{{ $imgRepo }}{{ end }}:{{ $imgTag }}
          env:
            # wash resolves its XDG data/config/cache dirs under $HOME; point it
            # at the writable /tmp emptyDir so the host runs with a read-only root
            # filesystem. A user-supplied runtime.env HOME (below) overrides this.
            - name: HOME
              value: /tmp
            - name: WASMCLOUD_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: WASMCLOUD_HOST_ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- /* Host memory budgets, from the effective `resources`:
                   `limits.memory` is the host's total guest memory budget,
                   guestMemoryMode says whether that budget is enforced or only
                   counted, and defaultHeapMemory/coreInstances are wasmtime
                   knobs parked alongside them (all three stripped back out of
                   the `resources:` block below). Unset means unset — the host
                   then derives its budget from its cgroup, counts against it
                   rather than enforcing it, and leaves the pool knobs at
                   wasmtime's defaults.

                   These go through the flags' `WASH_*` env fallbacks rather
                   than `args` on purpose. The chart is routinely paired with a
                   host image it does not ship (`runtime.image.tag`), and an
                   older host aborts on an argument it does not recognise —
                   whereas it simply ignores an env var it has never heard of.
                   Keep any new host knob on this side of that line. */}}
            {{- with $resources.limits }}
            {{- with .memory }}
            - name: WASH_HOST_MAX_GUEST_MEMORY
              value: "{{ . }}"
            {{- end }}
            {{- end }}
            {{- with $resources.defaultHeapMemory }}
            - name: WASH_DEFAULT_HEAP_MEMORY
              value: "{{ . }}"
            {{- end }}
            {{- with $resources.coreInstances }}
            - name: WASH_CORE_INSTANCES
              value: "{{ . }}"
            {{- end }}
            {{- with $resources.guestMemoryMode }}
            - name: WASH_GUEST_MEMORY_MODE
              value: "{{ . }}"
            {{- end }}
            {{- /* Not `with`: Go templates treat the integer 0 as empty, and
                   `0` is the most serialized setting a host can be given (it
                   clamps to one start at a time). Tested for a number instead,
                   so nil, "" and a mistyped bool all skip rather than reaching
                   the host as an argument it cannot parse. */}}
            {{- $starts := $resources.maxConcurrentStarts }}
            {{- if or (kindIs "int64" $starts) (kindIs "float64" $starts) (and (kindIs "string" $starts) (ne $starts "")) }}
            - name: WASH_MAX_CONCURRENT_STARTS
              value: "{{ $starts }}"
            {{- end }}
            {{- with $top.Values.runtime.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /* Optional envFrom (chart-wide runtime.envFrom + per-host-group). */}}
          {{- if or $top.Values.runtime.envFrom .envFrom }}
          envFrom:
            {{- with $top.Values.runtime.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          args:
            {{- if .logLevel }}
            - "--log-level={{ .logLevel }}"
            {{- end }}
            - "host"
            - "--host-name=$(WASMCLOUD_HOST_IP)"
            - "--host-group={{ .name }}"
            - "--environment=$(WASMCLOUD_HOST_ENVIRONMENT)"
            - "--scheduler-nats-url={{ include "runtime-operator.schedulerNatsUrl" (dict "ctx" $top "group" .) }}"
            {{- if $top.Values.global.tls.enabled }}
            - "--scheduler-nats-tls-ca=/runtime-cert/ca.crt"
            - "--scheduler-nats-tls-cert=/runtime-cert/tls.crt"
            - "--scheduler-nats-tls-key=/runtime-cert/tls.key"
            {{- end }}
            - "--data-nats-url={{ include "runtime-operator.dataNatsUrl" (dict "ctx" $top "group" .) }}"
            {{- if $top.Values.global.tls.enabled }}
            - "--data-nats-tls-ca=/data-cert/ca.crt"
            - "--data-nats-tls-cert=/data-cert/tls.crt"
            - "--data-nats-tls-key=/data-cert/tls.key"
            {{- end }}
            {{- /* The `wasmcloud:nats` plugin's own address. Defaults to the
                   host's data plane — and carries that data plane's TLS
                   material with it as one bundle. Set
                   `wasmcloudNatsUrl` when the NATS workloads talk to is not
                   the one backing the data plane. Whether a
                   manifest may describe a binding at all is
                   `plugins[].workloadConfig` — see values.yaml. */}}
            {{- with .wasmcloudNatsUrl }}
            - "--wasmcloud-nats-url={{ . }}"
            {{- end }}
            - "--oci-cache-dir=/oci-cache"
            {{- with $top.Values.runtime.drainDelaySeconds }}
            - "--drain-delay={{ . }}s"
            {{- end }}
            {{- if $endpoint.enabled }}
            - "--probe-addr=0.0.0.0:{{ $endpoint.port }}"
            {{- end }}
            {{- /* `networking` is the host's half of every two-sided grant, plus
                   the ceilings it enforces alone. A key is rendered only when
                   the values file sets it, so an unset one keeps the host's own
                   default rather than having the chart restate it — which
                   matters for the derived ceilings, where "unset" and "the same
                   number typed out" mean different things downstream. */}}
            {{- with .networking }}
            {{- if .allowHostLoopback }}
            - "--allow-host-loopback"
            {{- end }}
            {{- with .socketEgress }}
            - "--socket-egress={{ . }}"
            {{- end }}
            {{- if hasKey . "denySpecialRanges" }}
            - "--deny-special-ranges={{ .denySpecialRanges }}"
            {{- end }}
            {{- if .denyPrivateRanges }}
            - "--deny-private-ranges"
            {{- end }}
            {{- with .maxConnections }}
            - "--max-connections={{ . }}"
            {{- end }}
            {{- with .maxHttpIngressConnections }}
            - "--max-http-ingress-connections={{ . }}"
            {{- end }}
            {{- with .maxOutboundHttpConnectionsPerWorkload }}
            - "--max-outbound-http-connections-per-workload={{ . }}"
            {{- end }}
            {{- with .maxOutboundSocketConnectionsPerWorkload }}
            - "--max-outbound-socket-connections-per-workload={{ . }}"
            {{- end }}
            {{- with .maxInboundSocketConnectionsPerWorkload }}
            - "--max-inbound-socket-connections-per-workload={{ . }}"
            {{- end }}
            {{- end }}
            {{- if and (.http) (.http.enabled) }}
            - "--http-addr=0.0.0.0:{{ .http.port }}"
            {{- if and ($top.Values.global.tls.enabled) (.http.tls) (.http.tls.enabled) }}
            - "--tls-cert-path=/tls-cert/tls.crt"
            - "--tls-key-path=/tls-cert/tls.key"
            {{- end }}
            {{- end }}
            {{- /* Extra CA bundles this host trusts when pulling images. The
                   chart's own CA is mounted at /runtime-cert/ca.crt whenever
                   global.tls is on, so a registry running in this cluster
                   behind a hostGroup's http.tls needs only that path here,
                   with no bundle to distribute. Chart-wide entries first,
                   then per-host-group ones. */}}
            {{- range concat ($top.Values.runtime.ociCaPaths | default list) (.ociCaPaths | default list) }}
            - "--oci-ca-path={{ . }}"
            {{- end }}
            {{- if and (.webgpu) (.webgpu.enabled) }}
            - "--wasi-webgpu"
            {{- end }}
            {{- range .wasmProposals }}
            - "--wasm-proposal={{ . }}"
            {{- end }}
            {{- /* Host component plugins with no config/secretFrom/allowedHosts:
                   one --host-plugin flag per entry, rendered into the CLI's
                   `key=value` grammar (unchanged). Entries that DO set any of
                   those render into the mounted config file instead — see
                   $needsConfigFile / --config below. */}}
            {{- range $cliPlugins }}
            - "--host-plugin=id={{ .id }}{{ if .image }},image={{ .image }}{{ if .pullPolicy }},pull={{ .pullPolicy }}{{ end }}{{ if .digest }},digest={{ .digest }}{{ end }}{{ else if .file }},file={{ .file }}{{ end }}{{ if .maxRestarts }},max-restarts={{ .maxRestarts }}{{ end }}"
            {{- end }}
            {{- if $needsConfigFile }}
            - "--user-config=/etc/wasmcloud/host-config/config.yaml"
            {{- end }}
            {{- /* Chart-wide runtime.extraArgs applies to every host group; per-host-group
                   .extraArgs is appended after it. */}}
            {{- with $top.Values.runtime.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          imagePullPolicy: {{ $top.Values.runtime.image.pull_policy }}
          volumeMounts:
            - name: oci-cache
              mountPath: /oci-cache
            - name: tmp
              mountPath: /tmp
            {{- if $top.Values.global.tls.enabled }}
            - name: runtime-cert
              mountPath: /runtime-cert
              readOnly: true
            - name: data-cert
              mountPath: /data-cert
              readOnly: true
            {{- if and (.http) (.http.enabled) (.http.tls) (.http.tls.enabled) }}
            - name: tls-cert
              mountPath: /tls-cert
              readOnly: true
            {{- end }}
            {{- end }}
            {{- /* Optional host-container volumeMounts (pair with .volumes
                   above). Rendered unconditionally so a TLS-off install still
                   mounts user volumes. */}}
            {{- with .volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $needsConfigFile }}
            - name: host-plugin-config
              mountPath: /etc/wasmcloud/host-config
              readOnly: true
            {{- range $configFromNames }}
            - name: host-plugin-config-{{ . }}
              mountPath: /etc/wasmcloud/host-plugin-config/{{ . }}
              readOnly: true
            {{- end }}
            {{- range $secretFromNames }}
            - name: host-plugin-secret-{{ . }}
              mountPath: /etc/wasmcloud/host-plugin-secrets/{{ . }}
              readOnly: true
            {{- end }}
            {{- end }}
          {{- with omit $resources "defaultHeapMemory" "coreInstances" "guestMemoryMode" "maxConcurrentStarts" }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- if and (.http) (.http.enabled) }}
            - name: http
              containerPort: {{ .http.port }}
              protocol: TCP
            {{- end }}
            {{- if $endpoint.enabled }}
            - name: probes
              containerPort: {{ $endpoint.port }}
              protocol: TCP
            {{- end }}
            {{- /* Optional additional container ports (e.g. metrics scrape).
                   Do NOT re-list the http port — the chart renders it from
                   `.http.port` above; a duplicate containerPort fails
                   Deployment validation. */}}
            {{- with .ports }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /* With the probe endpoint on, the probes ask the host about
                 itself: `/livez` is "restart me", `/readyz` is "stop sending me
                 work". Without it they fall back to a TCP connect on the
                 traffic port, which cannot tell a wedged host from a busy one
                 and cannot say "full" at all. Every field
                 but `enabled` is passed through as given, so a `0` reaches the
                 manifest and `runtime.probes` stays the one place the timings
                 are written down. */}}
          {{- if or $endpoint.enabled (and (.http) (.http.enabled)) }}
          {{- /* Liveness on the probe port answers only once the host has
                 bound it, which is late in startup — after the plugin pulls
                 and compiles. A startup probe gives that as long as it needs
                 without loosening the liveness timings that follow it. */}}
          {{- if and $endpoint.enabled $liveness.enabled }}
          startupProbe:
            httpGet:
              path: /livez
              port: probes
            periodSeconds: 5
            failureThreshold: {{ $endpoint.startupFailureThreshold }}
          {{- end }}
          {{- if $liveness.enabled }}
          livenessProbe:
            {{- if $endpoint.enabled }}
            httpGet:
              path: /livez
              port: probes
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            {{- range $field, $value := omit $liveness "enabled" }}
            {{ $field }}: {{ $value }}
            {{- end }}
          {{- end }}
          {{- if $readiness.enabled }}
          readinessProbe:
            {{- if $endpoint.enabled }}
            httpGet:
              path: /readyz
              port: probes
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            {{- range $field, $value := omit $readiness "enabled" }}
            {{ $field }}: {{ $value }}
            {{- end }}
          {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml $top.Values.runtime.securityContext | nindent 12 }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ $top.Values.runtime.terminationGracePeriodSeconds }}
---
{{- end }}
