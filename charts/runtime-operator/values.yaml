global:
  image:
    # -- Globally override container image registry, e.g. "ghcr.io"
    registry: ""
    # -- Globally override container imagePullSecrets
    pullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  nats:
    # -- Control-plane / scheduler NATS URL. Used by the operator (`-nats-url`)
    # and the host runtime (`--scheduler-nats-url`) so both connect to the same
    # control plane. When empty, defaults to the in-cluster NATS service:
    # `nats://nats.<release-namespace>.svc.cluster.local:4222`. Override to point
    # at an external NATS cluster, a different service name/port, or NATS in
    # another namespace. Can be overridden per host group via
    # `runtime.hostGroups[].schedulerNatsUrl`.
    schedulerUrl: ""
    # -- Data-plane NATS URL. Used by the host runtime (`--data-nats-url`) for
    # Wasm workload messaging, allowing workloads to use a separate NATS cluster
    # from the control plane. When empty, defaults to the same in-cluster NATS
    # service as `schedulerUrl`. Can be overridden per host group via
    # `runtime.hostGroups[].dataNatsUrl`.
    dataUrl: ""
  tls:
    # -- Enable TLS for NATS connections and certificate generation.
    # Set to false when a service mesh (e.g. Istio) provides mTLS.
    enabled: true
  certificates:
    # -- Enable automatic generation of self-signed TLS certificates for the operator and runtime hosts.
    # Ignored when global.tls.enabled is false.
    generate: true
    # -- Name of the Kubernetes Secrets holding the Private CA certificate ( NATS )
    caSecretName: wasmcloud-ca
    # -- Name of the Kubernetes Secret holding the TLS server certificate for the NATS server (if enabled in this chart)
    natsCertSecretName: wasmcloud-nats-tls
    # -- Name of the Kubernetes Secret holding the TLS client certificate the operator presents to NATS
    operatorCertSecretName: wasmcloud-operator-tls
    # -- Name of the Kubernetes Secret holding the TLS client certificate host pods present to the scheduler NATS connection
    runtimeCertSecretName: wasmcloud-runtime-tls
    # -- Name of the Kubernetes Secret holding the TLS client certificate host pods present to the data NATS connection
    dataCertSecretName: wasmcloud-data-tls

# -- Baseline NetworkPolicies for the chart's pods. Each enabled component gets a
# NetworkPolicy whose podSelector matches its pods, restricting ingress to the
# ports the component actually serves (traffic on any other port is dropped).
# Egress is intentionally left unrestricted: hosts pull OCI images from arbitrary
# registries, the operator talks to the Kubernetes API, and any component may
# connect to an external NATS cluster. Tightening egress safely requires
# environment-specific knowledge and is left to the consumer. Set `enabled` to
# false if a CNI without NetworkPolicy support or a service mesh manages this.
networkPolicy:
  enabled: true

# -- Values for installing a basic NATS Server with Ephemeral Storage. If you prefer to install NATS separately, set `enabled` to `false`.
nats:
  enabled: true
  # -- Labels to add to the NATS pod template
  podLabels: {}
  # -- Annotations to add to the NATS pod template
  podAnnotations: {}
  image:
    registry: docker.io
    repository: nats
    pull_policy: Always
    tag: "2.12.8-alpine"
  # -- Compute resources for the NATS container. Idle ~6Mi (profiled); the
  # bundled NATS is light control-plane use, so the limit is sized accordingly.
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      memory: "128Mi"
  # -- The bundled NATS server does not use the Kubernetes API.
  automountServiceAccountToken: false
  # -- Pod-level securityContext. Hardened by default; override any field via values.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # -- Container securityContext. Hardened by default. JetStream data is written
  # to an emptyDir, so read-only root works.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Name of the service account to use. If not set and create is true, a name is generated using the fullname template. If not set and create is false, "default" is used.
    name: ""
    # -- Annotations to add to the service account
    annotations: {}
  # -- How long a terminating NATS pod has to shut down before it is killed.
  # On `SIGTERM` the server closes its client connections and its JetStream
  # store, so the hosts connected to it see a disconnect rather than a stalled
  # socket. It exits as soon as that is done; this is only the ceiling.
  terminationGracePeriodSeconds: 30

operator:
  enabled: true
  # -- Labels to add to the operator pod template
  podLabels: {}
  # -- Annotations to add to the operator pod template
  podAnnotations: {}
  image:
    registry: ghcr.io
    repository: wasmcloud/runtime-operator
    pull_policy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  # -- Compute resources for the operator container. Idle ~19Mi (profiled), but
  # the informer cache grows with the number of watched objects (Hosts,
  # Workloads, Pods, EndpointSlices), so the limit keeps extra headroom.
  # Raise it for large clusters.
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      memory: "192Mi"
  # -- The operator calls the Kubernetes API, so it needs its ServiceAccount token.
  automountServiceAccountToken: true
  # -- Pod-level securityContext. Hardened by default; override any field via
  # values (e.g. `--set operator.podSecurityContext.runAsUser=1000`). fsGroup
  # makes the chart's emptyDir volumes writable by the non-root process.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # -- Container securityContext. Hardened by default. Set
  # `readOnlyRootFilesystem: false` if the container must write outside its
  # mounted volumes.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  service:
    type: ClusterIP
    port: 8443
  # -- This section builds out the service account.
  # See the [Kubernetes documentation](https://kubernetes.io/docs/concepts/security/service-accounts/).
  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Name of the service account to use. If not set and create is true, a name is generated using the fullname template. If not set and create is false, "default" is used.
    name: ""
    # -- Annotations to add to the service account
    annotations: {}
  # -- List of namespaces to watch. If empty, the operator watches all namespaces.
  watchNamespaces: []
  # -- List of namespaces where host Pods run. The operator's Pod
  # informer cache and per-namespace Pod RBAC cover this set so
  # HostPodReconciler can manage finalizers on host Pods.
  # Leave empty when host Pods only run in the operator's own namespace (the
  # chart's default deployment topology).
  hostNamespaces: []
  # -- Allow WorkloadDeployments to schedule onto Hosts whose Environment
  # differs from the WorkloadDeployment's own namespace, via
  # spec.template.spec.environment. The default (true) preserves existing
  # behavior where workloads with no `environment` set may schedule onto any
  # matching host regardless of which tenant namespace the host runs in.
  #
  # SECURITY: This default is permissive across tenants. In a multi-tenant
  # cluster where each tenant has its own namespace and host pods, a
  # tenant in `namespace-a` can target hosts in `namespace-b` simply by
  # setting `spec.template.spec.environment: namespace-b`. If your install
  # relies on namespace boundaries for tenant isolation, set this to
  # `false`: scheduling will then be locked to the workload's own
  # namespace, and any cross-tenant `environment` is rejected with a
  # `CrossEnvironmentSchedulingDenied` Warning Event and a
  # `HostSelection=False` condition on the Workload.
  allowSharedHosts: true
  # -- Additional environment variables for the operator container, appended
  # after the chart-managed vars. Standard Kubernetes env shape (supports
  # `valueFrom` secretKeyRef / configMapKeyRef).
  # Example:
  #   env:
  #     - name: LOG_LEVEL
  #       value: debug
  env: []
  # -- Populate the operator container's environment from ConfigMaps/Secrets.
  # Standard Kubernetes `envFrom` shape.
  # Example:
  #   envFrom:
  #     - secretRef:
  #         name: operator-extra-config
  envFrom: []
  # -- Additional CLI args appended verbatim to the operator container, for
  # operator flags the chart does not template (e.g.
  # `-cpu-backpressure-threshold=75`). Note: `-leader-elect` is always passed
  # by the chart, so it does not need to be added here.
  # Example:
  #   extraArgs:
  #     - "-cpu-backpressure-threshold=75"
  extraArgs: []
  # -- How long a terminating operator pod has to shut down before it is
  # killed. On `SIGTERM` the manager stops its controllers and lets the
  # reconciles already running finish, waiting up to controller-runtime's 30s
  # for them, so anything at or below that is SIGKILL at the moment it gives
  # up. It does not release its leader election lease
  # (`LeaderElectionReleaseOnCancel` is off), so the replacement waits out
  # `LeaseDuration` either way.
  terminationGracePeriodSeconds: 45

gateway:
  # -- DEPRECATED: runtime-gateway is being removed. HTTP routing is now handled
  # by the runtime-operator via EndpointSlices.
  # Set kubernetetes.service.name in your WorkloadDeployment spec to enable automatic
  # EndpointSlice management. To disable installing the runtime-gateway, set `enabled` to `false`.
  enabled: true
  # -- Fallback endpoint when no workloads are available. Example: "http://notfound.svc.cluster.local"
  fallbackEndpoint: ""
  image:
    registry: ghcr.io
    repository: wasmcloud/runtime-gateway
    pull_policy: Always
  # -- Compute resources for the gateway container. Idle ~8Mi (profiled); a light
  # proxy, with headroom for the Go runtime/GC under load.
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
    limits:
      memory: "96Mi"
  # -- The gateway is a controller (it reconciles EndpointSlices), so it needs
  # its ServiceAccount token to reach the Kubernetes API.
  automountServiceAccountToken: true
  # -- Pod-level securityContext. Hardened by default; override any field via values.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # -- Container securityContext. Hardened by default. Set
  # `readOnlyRootFilesystem: false` to write outside mounted volumes.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  service:
    type: ClusterIP
    port: 80
    # -- Only used if service type is NodePort
    nodePort: null
  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Name of the service account to use. If not set and create is true, a name is generated using the fullname template. If not set and create is false, "default" is used.
    name: ""
    # -- Annotations to add to the service account
    annotations: {}
  # -- How long a terminating gateway pod has to shut down before it is killed.
  # On `SIGTERM` the gateway stops accepting connections and gives the requests
  # already in flight up to 15s to finish, so anything below that hangs up on a
  # caller mid-response. It runs that drain inside a controller-runtime manager,
  # which waits up to 30s for it, so the grace clears the longer of the two.
  terminationGracePeriodSeconds: 45

runtime:
  # -- Extra CA certificate bundles (paths inside the host container) trusted
  # when pulling images, for a registry behind a private or in-cluster CA that
  # the public roots do not cover. Applies to every host group; add
  # `hostGroups[].ociCaPaths` for one group alone.
  #
  # A registry served from a host group in this cluster (`hostGroups[].http.tls`)
  # presents a certificate from the chart's own CA, which is already mounted at
  # /runtime-cert/ca.crt whenever `global.tls.enabled`, so trusting it needs
  # only that path, with no bundle to distribute:
  #   ociCaPaths: ["/runtime-cert/ca.crt"]
  #
  # Prefer this to `extraArgs: [--allow-insecure-registries]`, which does not
  # relax verification but replaces it: every registry drops to plain HTTP, so
  # nothing is verified and credentials travel in the clear.
  ociCaPaths: []
  # -- Labels to add to runtime host pod templates
  podLabels: {}
  # -- Annotations to add to runtime host pod templates
  podAnnotations: {}
  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Name of the service account to use. If not set and create is true, a name is generated using the fullname template. If not set and create is false, "default" is used.
    name: ""
    # -- Annotations to add to the service account
    annotations: {}
  image:
    registry: ghcr.io
    repository: wasmcloud/wash
    pull_policy: Always
    tag: ""
  # -- The host talks to NATS, not the Kubernetes API, so it does not need its token.
  automountServiceAccountToken: false
  # -- Pod-level securityContext. Hardened by default; override any field via values.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # -- Container securityContext. Hardened by default. The host's OCI cache and
  # scratch space are emptyDir volumes, so read-only root works. Set
  # `readOnlyRootFilesystem: false` to opt out.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  # -- Compute resources applied to every host group, unless a host group sets
  # its own `resources` (see hostGroups[].resources). Host pods run Wasm
  # components in-process, so memory scales with the workloads scheduled onto a
  # host: size `limits.memory` for your expected per-host workload density, or
  # remove it to leave host memory uncapped.
  #
  # `defaultHeapMemory`, `coreInstances`, `guestMemoryMode` and
  # `maxConcurrentStarts` are host knobs rather than Kubernetes resource fields;
  # the chart strips them out of the container's `resources` block and sets them
  # as `WASH_DEFAULT_HEAP_MEMORY` / `WASH_CORE_INSTANCES` /
  # `WASH_GUEST_MEMORY_MODE` / `WASH_MAX_CONCURRENT_STARTS` for the host.
  # Leaving them empty uses the host's own defaults.
  #
  # The simplest way to change host sizing for the whole release:
  #   --set runtime.resources.limits.memory=2Gi
  #   --set runtime.resources.requests.cpu=500m
  resources:
    requests:
      cpu: "250m"
      memory: "64Mi"
    limits:
      memory: "512Mi"
    # -- Ceiling on any single guest linear memory. Empty leaves wasmtime's
    # default of 4GiB.
    defaultHeapMemory: ""
    # -- Instance slots the pooling allocator keeps. Empty leaves wasmtime's
    # default of 1000.
    coreInstances: ""
    # -- Whether `limits.memory` is enforced against total guest memory or only
    # counted: `count` (the default) charges every guest `memory.grow` to the
    # budget and reports what it would have refused, but allows it; `enforce`
    # refuses growth past the budget, which the guest sees as `memory.grow`
    # returning -1. Guest memory has never been bounded in aggregate, so run in
    # `count` and watch the host's reported high-water mark before switching.
    #
    # Before setting `enforce`, note that the chart passes `limits.memory`
    # through as the guest budget unchanged — 100% of the pod. Guests are not
    # all a host pod holds: wasmtime itself, compiled module images, NATS, OCI
    # pulls and HTTP buffers come out of the same limit, and none of them is
    # charged to this budget. A host left to derive its own budget keeps a
    # quarter back for them. So an enforced budget equal to `limits.memory` can
    # still be OOM-killed before it ever refuses a guest; give the host its
    # headroom by setting `limits.memory` above the guest budget you want, or
    # by overriding `WASH_HOST_MAX_GUEST_MEMORY` below it via `runtime.env`.
    guestMemoryMode: ""
    # -- How many workloads a host pulls and compiles at once. Each start it
    # admits ends in a single-threaded compile, so this is how many cores a
    # burst of starts takes from the ones serving HTTP and NATS — a host that
    # stops accepting connections for long enough fails its liveness probe and
    # is restarted, taking every workload on it with it. Set it to `1` on a
    # host that must keep serving through a large redeploy, bearing in mind
    # that the same permit covers the image pull, so a lower number serializes
    # network waiting along with the compiling.
    #
    # Empty leaves the host to size itself: one fewer than the cores it can
    # see, at most 4. Note what it sees — the count comes from the cgroup, so
    # it follows `limits.cpu`, and a host with no cpu limit sizes itself
    # against the whole node however small its `requests.cpu` is. Set this
    # explicitly on a host group that is requested far below the node it lands
    # on.
    maxConcurrentStarts: ""
  # -- Probes for host containers, rendered only for a host group that serves
  # HTTP (`hostGroups[].http.enabled`); both connect to its `http` port. A host
  # group sets its own with `hostGroups[].probes`, and any field left out of
  # that falls back to the value here.
  #
  # Readiness and liveness are deliberately not tuned alike. Both connect to
  # the port the host serves workload routes on, which the kernel answers from
  # the listener's accept queue whether or not the host is polling it — so what
  # a failure reports is a host busy enough to have let that queue fill.
  # Leaving the Service over that is cheap, which is readiness' job. Restarting
  # is a different trade: the pod loses every workload running on it, and the
  # scheduler places them all again at once, which is the burst that stalled it
  # in the first place. So liveness waits a good deal longer before calling a
  # host dead.
  #
  # `liveness.enabled: false` leaves nothing to recycle a wedged host: the
  # operator deletes the *Host* of a host it stops hearing from, and its
  # workloads move, but the pod is not the operator's to delete and keeps
  # running whatever it still holds. Disable it only where something else
  # takes that job.
  probes:
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
  # -- Additional environment variables applied to every host group container,
  # appended after the chart-managed vars and before any per-host-group `env`.
  # Standard Kubernetes env shape (supports `valueFrom`).
  env: []
  # -- Populate every host group container's environment from
  # ConfigMaps/Secrets. Merged with per-host-group `envFrom`. Standard
  # Kubernetes `envFrom` shape.
  envFrom: []
  # -- Additional CLI args appended to every host group container, for host
  # flags the chart does not template. Merged with per-host-group `extraArgs`.
  extraArgs: []
  # -- How long a terminating host pod has to shut down before it is killed.
  # On `SIGTERM` the host stops taking work, waits up to 5s for the commands
  # already running to finish, then stops itself — unbinding every plugin the
  # workloads it holds are bound to. Kubernetes sends `SIGKILL` when this
  # expires, so anything below that 5s drain cuts the shutdown short and leaves
  # the unbinding to the operator's unreachable-host path instead.
  terminationGracePeriodSeconds: 15
  hostGroups:
    - name: default
      # -- Namespace to deploy this host group's Deployment, Service, generated
      # TLS Secret, and ServiceAccount into. Empty (default) deploys to the
      # chart release's namespace. When overridden, ensure the namespace
      # exists and is included in `operator.hostNamespaces` so the operator
      # has Pod RBAC + cache access to manage host Pod lifecycle there.
      namespace: ""
      replicas: 1
      # -- Per-host-group override of the scheduler NATS URL. Empty falls back to
      # `global.nats.schedulerUrl`, then the in-cluster NATS service.
      schedulerNatsUrl: ""
      # -- Per-host-group override of the data NATS URL. Empty falls back to
      # `global.nats.dataUrl`, then the in-cluster NATS service.
      dataNatsUrl: ""
      # -- Per-host-group address for the `wasmcloud:nats` plugin's bindings.
      # Empty falls back to this group's data NATS URL. Set it when the NATS
      # your workloads talk to is not the one backing the host's data plane.
      #
      # Left empty, the data plane's address arrives together with the TLS
      # material already mounted in the container, so a stock install works
      # with no per-binding configuration. Set this and the certs stay behind:
      # they say nothing about another NATS, and inheriting them would be a
      # confusing handshake failure at best. A binding pointed elsewhere names
      # its own `tls-*` (and credentials, and grants) on its `plugins` entry.
      #
      # It carries no credentials and no grant either way.
      wasmcloudNatsUrl: ""
      # -- The `wasmcloud:nats` bindings this host group serves are declared
      # like every other plugin's, under `plugins` above:
      #
      #   plugins:
      #     - id: wasmcloud-nats
      #       bindings:
      #         orders:
      #           config:
      #             subject-allow: orders.processed,orders.received
      #             stream-allow: ORDERS,PROCESSED
      #             bucket-allow: order-totals
      #           secretFrom:
      #             - orders-nats-creds
      #
      # A workload asks for one by `(implements orders)` and this is where what
      # it *is* gets declared: the servers it dials, the credentials it dials
      # them with, and the subject, stream, and bucket grants it carries.
      # `workloadConfig` on that entry decides whether a manifest may describe
      # a binding of its own; it defaults to `deny`.
      #
      # Keys are `wasmcloud:nats` config keys — `servers`, `subject-allow`,
      # `stream-allow`, `bucket-allow`, `creds`, `jwt`/`nkey-seed`,
      # `username`/`password`, `token`, `tls-*`, `jetstream-domain`. The
      # entry's own `config` applies to every binding; each entry under
      # `bindings` layers over it. Leave `servers` out to take
      # `wasmcloudNatsUrl` above, which brings the data plane's TLS with it.
      #
      # The three grants are ceilings, not switches: a workload may ask for a
      # subset of what is declared here and is refused only for asking for
      # more. All three are deny-by-default, and `stream-allow` on its own
      # reaches nothing readable — every stored message a workload reads is
      # checked against `subject-allow` as well, so a binding granted streams
      # and no subjects gets empty results rather than an error. Grant the
      # subjects those streams store alongside the stream itself. (The host
      # warns at bind when a binding has streams and no subjects.)
      #
      # `inbox-prefix` is refused on the entry's own `config`: it would give
      # every workload on the group the same inbox, and two workloads sharing
      # an inbox consume each other's replies. Per named binding it is fine,
      # and unset is better still — the per-workload default already isolates
      # replies, and the host's one-shot reply grant authorizes a responder's
      # reply without any `_INBOX` grant at all.
      #
      # What stays in the workload's manifest: `jetstream-subscriptions`,
      # `core-subscriptions`, `kv-watches`, `component`, and `ack-mode` — what
      # it wants delivered, within the grant declared here.
      # -- Per-host-group environment variables, appended after `runtime.env`.
      # Standard Kubernetes env shape (supports `valueFrom`).
      env: []
      # -- Per-host-group `envFrom`, merged with `runtime.envFrom`.
      envFrom: []
      # -- Per-host-group extra CLI args, appended after `runtime.extraArgs`.
      extraArgs: []
      # -- Per-host-group host image override. Any of `registry`, `repository`,
      # `tag` set here take precedence over the chart-wide `runtime.image`; unset
      # keys inherit it. Lets one release mix host versions (e.g. run one host
      # group on a newer/feature build). Omit to use `runtime.image` for the group.
      # image:
      #   tag: "some-other-tag"
      service:
        type: ClusterIP
      webgpu:
        enabled: false
      # -- Additional wasm proposals to enable on this host group's engine,
      # rendered as `--wasm-proposal=<name>` args. Accepted names:
      # component-model-async, gc, exception-handling, wide-arithmetic,
      # threads, tail-call.
      wasmProposals: []
      # -- Every plugin this host group serves and how the operator configures
      # it, native or component.
      #
      # A **native** entry has no `image`/`file`: the host already has the
      # plugin compiled in, and the entry exists to configure it. A
      # **component** entry names exactly one of `image` or `file` and is
      # loaded as well — see `hostPlugins` below for the component-only fields.
      #
      # Beyond a component entry's own fields, every entry may set:
      #
      #   workloadConfig  `deny` (default), `allow`, or `warn`. Under `deny`,
      #                   keys this plugin considers the host's come only from
      #                   here: a workload that sets one, that widens a grant
      #                   the operator declared, or that names a binding absent
      #                   from `bindings` once any binding is declared, fails
      #                   to deploy. Under `allow` a workload's own interface
      #                   config layers over what is declared here. `warn` is
      #                   `allow` with everything `deny` would refuse logged —
      #                   how you rehearse a flip to `deny` without breaking a
      #                   workload mid-flight.
      #
      #                   `deny` refuses nothing where nothing is declared, so
      #                   it is safe as the default: a plugin that names no
      #                   keys of its own, under an entry that sets none, owns
      #                   none.
      #   hostOwnedKeys   extra keys claimed for the host under `deny`, on top
      #                   of the ones the plugin declares in code and the ones
      #                   this entry sets. The point is the keys left *unset* —
      #                   an allowlist nobody wrote must resolve to empty, not
      #                   to whatever the workload wrote.
      #   bindings        the named backends this host serves, keyed by the
      #                   `(implements ..)` label a workload asks for. Each
      #                   takes its own `config`/`configFrom`/`secretFrom`,
      #                   layered over the entry's.
      #
      # Every entry here is file-backed (rendered into the `wash host` config
      # file, never a CLI arg), since a binding can carry credentials.
      #
      # Examples:
      #
      #   plugins:
      #     - id: wasmcloud-nats           # native: no image/file
      #       config:
      #         servers: nats://nats.default.svc:4222
      #       bindings:
      #         orders:
      #           config:
      #             subject-allow: orders.processed,orders.received
      #             stream-allow: ORDERS
      #           secretFrom: [orders-nats-creds]
      #     - id: wasmcloud-secrets        # component: has a source
      #       image: ghcr.io/wasmcloud/plugins/secrets:0.1.0
      #       allowedHosts: [vault.internal]
      #       hostOwnedKeys: [vault-addr, vault-role]
      #       bindings:
      #         prod:
      #           configFrom: [vault-prod]
      plugins: []
      # -- Deprecated alias for `plugins`, from when only component plugins
      # could be declared. Entries here must name an `image` or `file`; a
      # native plugin's configuration belongs under `plugins`. Merges with
      # (does not replace) `plugins`.
      #
      # Host component plugins for this host group: WebAssembly components
      # that provide a host capability, each served from its own supervised
      # store to every workload that imports its interface.
      #
      # Requires a wash image built with the `host-component-plugins` feature
      # (not enabled in release images yet); a host handed a plugin it cannot
      # build fails to start.
      #
      # Each entry needs an `id` plus exactly one of `image` (OCI reference) or
      # `file` (path in the container). Optional: `pullPolicy`
      # (always | ifNotPresent | never, image only), `maxRestarts`, `digest`
      # (image only).
      #
      # A plugin entry with none of `config`/`configFrom`/`secretFrom`/
      # `allowedHosts`/`allowedIpNameLookups` set renders as a plain
      # `--host-plugin=...` CLI arg (unchanged from before). Setting any of
      # those five instead renders the WHOLE entry into a `wash host` config
      # file (`--config`) mounted into the pod — never a CLI arg, so a secret
      # never appears on the command line:
      #
      #   config          literal key-value pairs, this plugin's own
      #                   bind-time config (delivered via the same
      #                   `wasmcloud:secrets`-style `on-workload-bind` hook a
      #                   workload gets, never written to a file the plugin
      #                   itself reads).
      #   configFrom      names of ConfigMaps (in this release's namespace)
      #                   to merge in, last-source-wins over `config`. Each
      #                   name's ConfigMap is projected as a volume and read
      #                   by the HOST process only — see deployment.yaml.
      #   secretFrom      names of Secrets (same namespace), merged in last
      #                   (wins over `config`/`configFrom`). Same
      #                   host-only-reads-the-mount posture.
      #   allowedHosts    this plugin's own `wasi:http/outgoing-handler`
      #                   allowlist. Omitted/empty denies every outbound host
      #                   — a host component plugin is operator-controlled
      #                   and more privileged than a workload, so it gets no
      #                   ergonomic allow-all default.
      #
      # Editing any of these rolls the host automatically (the Deployment
      # carries a checksum over the rendered config file). Rotating the
      # CONTENTS of a ConfigMap/Secret named by `configFrom`/`secretFrom` is
      # different: the host resolves that file once, at startup, and the
      # kubelet updates the projected volume in place, so a running host keeps
      # serving what it read at boot. The Deployment carries
      # `{configmap,secret}.reloader.stakater.com/reload` annotations naming
      # exactly those objects — install stakater/Reloader and a rotation rolls
      # the host on its own. Without that controller the annotations are
      # inert, and a rotation needs a manual `kubectl rollout restart`.
      #
      #   allowedIpNameLookups  names this plugin's own
      #                   `wasi:sockets/ip-name-lookup` calls may resolve.
      #                   Omitted/empty denies every lookup.
      #
      # Examples:
      #
      #   hostPlugins:
      #     - id: acme-kv
      #       image: ghcr.io/acme/kv-host:1.0.0
      #       pullPolicy: ifNotPresent
      #       maxRestarts: 3
      #     - id: etcd-secrets
      #       image: ghcr.io/example/etcd-secrets:1.0.0
      #       allowedHosts:
      #         - https://etcd.internal:2379
      #       allowedIpNameLookups:
      #         - etcd.internal
      #       config:
      #         etcd-prefix: /wasmcloud/secrets
      #       configFrom:
      #         - etcd-connection-settings
      #       secretFrom:
      #         - etcd-client-cert
      #     - id: grpc-gateway
      #       image: ghcr.io/example/grpc-gateway:1.0.0
      #       ports:
      #         - name: grpc
      #           port: 50051        # the plugin binds 127.0.0.1:50051
      #           protocol: TCP
      #           publish: 31051     # the host binds :31051 and splices in
      #         - name: bulk
      #           port: 9000
      #           bind: 10.0.0.5     # the plugin binds 10.0.0.5:9000 itself
      hostPlugins: []
      # -- Networking policy for guests on this host group. Every value here is
      # the *host's* half of a two-sided grant: a workload or plugin must also
      # declare what it wants, so neither side can open a door alone.
      networking:
        # -- Let guests reach the machine's own loopback through the reserved
        # name `host.wasmcloud.internal`. A guest also needs its own
        # `allowedHostLoopbackPorts` entry naming the port. `127.0.0.1` keeps
        # meaning the guest's own virtual network either way.
        allowHostLoopback: false
        # -- How the raw-socket egress policy is applied: `count` or `enforce`.
        #
        # Raw socket connect was never gated, so enforcing on upgrade would
        # sever live traffic. `count` evaluates the policy, records what it
        # would refuse, and allows the connection anyway. Watch the
        # would-deny counters, then switch to `enforce`.
        socketEgress: count
        # -- Deny outbound connections to loopback, link-local (including the
        # cloud metadata address), multicast, and documentation ranges —
        # including whatever DNS returned for a permitted name.
        denySpecialRanges: true
        # -- Deny outbound connections to private ranges (RFC1918, ULA, CGNAT).
        # Off by default: reaching a sibling service on a private address is
        # the ordinary in-cluster case.
        denyPrivateRanges: false
        # -- Host-wide cap on live connections across every workload. Empty
        # derives it from the process's file-descriptor limit.
        maxConnections: ""
        # -- Pooled HTTP and gRPC connections one workload may hold. Idle
        # keep-alive connections count, so this is how large its pool may grow.
        maxOutboundHttpConnectionsPerWorkload: 128
        # -- Outbound raw `wasi:sockets` connections one workload may hold.
        maxOutboundSocketConnectionsPerWorkload: 256
        # -- Inbound published-port connections one workload serves at once.
        # A separate surface, because a workload whose inbound traffic
        # consumed its outbound allowance would deadlock serving requests that
        # need to make outbound calls.
        maxInboundSocketConnectionsPerWorkload: 256
        # -- Let guests expose declared ports on a real address.
        #
        # Off by default. With it off, a workload or plugin declaring a
        # published port fails to start rather than coming up silently
        # unreachable. Publishing makes a service reachable by every co-tenant
        # on the machine unless socketEgress is `enforce`.
        publishPorts: false
        # -- Restrict published ports to a range, e.g. "31000-32767". Empty
        # allows any port the OS will grant.
        publishPortRange: ""
      http:
        enabled: true
        port: 9191
        tls:
          # -- Enable TLS for the HTTP server. Requires global.tls.enabled to be true.
          # When enabled, a certificate is generated (if global.certificates.generate is true)
          # and the host serves HTTPS instead of HTTP.
          enabled: false
          certificate:
            # -- Name of the Kubernetes Secret holding the TLS server certificate for this host group. Ignored if global.certificates.generate is true.
            secretName: ""
            generate:
              # -- Whether to generate a self-signed TLS certificate for this host group. Ignored if global.certificates.generate is false or if certificate.secretName is set.
              enabled: false
              # -- Validity period (in days) for the generated TLS certificate. Ignored if global.certificates.generate is false.
              validity: 365
              # -- Common Name (CN) for the generated TLS certificate.
              commonName: ""
              # -- List of DNS Subject Alternative Names (SANs) for the generated TLS certificate.
              # Example: ["myapp.example.com", "myapp.default.svc.cluster.local"]
              domains: []
              # -- List of IP Subject Alternative Names (SANs) for the generated TLS certificate.
              # An address belongs here rather than under `domains`: a client
              # connecting to a URL written as an IP matches it against the IP
              # SANs only, so an address listed as a domain is never matched.
              # Example: ["127.0.0.1"]
              ipAddresses: []
      # -- Per-host-group compute resources. Omitted so this group inherits the
      # chart-wide `runtime.resources` above; uncomment to size one host group
      # differently (e.g. a webgpu group that needs more memory). Setting this
      # replaces `runtime.resources` wholesale rather than merging with it, so
      # repeat the wasmtime knobs here too if the group needs them:
      # resources:
      #   requests:
      #     cpu: "500m"
      #     memory: "128Mi"
      #   limits:
      #     memory: "2Gi"
      #   defaultHeapMemory: "512MiB"
      #   coreInstances: "200"
      #   guestMemoryMode: "enforce"
      #   maxConcurrentStarts: "1"
      # -- Per-host-group probes. Merged field by field over
      # `runtime.probes`, so a group can retune one timing and inherit the
      # rest:
      # probes:
      #   liveness:
      #     enabled: false
      # -- Extra CA bundles trusted when this group pulls images, added to the
      # chart-wide `runtime.ociCaPaths` rather than replacing it:
      # ociCaPaths:
      #   - "/runtime-cert/ca.crt"
